<body>
  <div>
    <div class="cap">iPhone 13 mini 375×812 (ready)</div>

  </div>
  <div>
    <div class="cap">iPhone 13 mini 375×812 (playing)</div>
    <div class="phone"><iframe id="b" src="../runner/index.html?touch=1&v=4&auto=1"></iframe></div>
  </div>

</html>
