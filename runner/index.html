  /* ══════════════════════════════════════════
     13. 프레임 루프
     ══════════════════════════════════════════ */
  var lastT = 0, acc = 0;
  var STEP = 1 / 120;

  function effects(dt) {
    // 파티클
    for (var i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      if (p.life <= 0) { particles.splice(i, 1); continue; }
      p.vy += (p.grav || 0) * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.exp(-1.6 * dt);
    }
    // 텍스트
    for (var j = texts.length - 1; j >= 0; j--) {
      texts[j].life -= dt;
      if (texts[j].life <= 0) { texts.splice(j, 1); }
    }
    // 잔상
    if (mode === "playing") {
      var spd = Math.sqrt(P.vx * P.vx + P.vy * P.vy);
      if (spd > 500) {
        trail.push({ x: P.x, y: P.y });
        if (trail.length > 14) { trail.shift(); }
      } else if (trail.length) {
        trail.shift();
      }
    } else if (trail.length) {
      trail.shift();
    }
    // 힌트 / 컷인 타이머
    if (hintTimer > 0) {
      hintTimer -= dt;
      if (hintTimer <= 0) { elHint.classList.remove("is-on"); }
    }
    if (cutinTimer > 0) {
      cutinTimer -= dt;
      if (cutinTimer <= 0) { elCutin.classList.remove("is-on"); }
    }
    // 사슬팔 집게 전개
    var clawTarget = rope.on ? 1 : 0;
    claw += (clawTarget - claw) * Math.min(1, dt * 13);
  }

  function frame(now) {
    window.requestAnimationFrame(frame);
    if (!lastT) { lastT = now; }
    var dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.05) { dt = 0.05; }
    if (dt < 0) { dt = 0; }

    // 느린 기기에서는 해상도를 한 단계 낮춰 프레임을 지킨다
    if (dt > 0.024) { slowFrames++; } else { slowFrames = Math.max(0, slowFrames - 1); }
    if (!lowFx && slowFrames > 50) {
      lowFx = true;
      maxDpr = 1.25;
      resize();
    }

    acc += dt;
    var guard = 0;
    while (acc >= STEP && guard < 10) {
      step(STEP);
      acc -= STEP;
      guard++;
    }
    if (guard >= 10) { acc = 0; }

    effects(dt);
    render(dt);
    updateHUD();
  }

  /* ══════════════════════════════════════════
     14. 위젯 API
     ══════════════════════════════════════════ */
  if (WIDGET) {
    WIDGET.onstate = function (data) {
      var next = normalize(data);
      if (next.best_score > S.best_score) { S.best_score = next.best_score; }
      if (next.best_distance > S.best_distance) { S.best_distance = next.best_distance; }
      S.runs_played = Math.max(S.runs_played, next.runs_played);
      S.total_swings = Math.max(S.total_swings, next.total_swings);
      hudCache.best = -1;
      updateHUD();
    };

    WIDGET.oncommand = function (command) {
      var line = String(command === null || command === undefined ? "" : command).trim();
      if (!line) { return false; }
      var seg = line.split(/\s+/);
      var word = seg[0];
      var args = seg.slice(1);

      if (word === "restart") {
        startRun();
        return true;
      }
      if (word === "difficulty") {
        var key = (args[0] || "").toLowerCase();
        if (!DIFF[key]) {
          throw new Error("난이도는 easy, normal, hard 중 하나여야 합니다.");
        }
        setDifficulty(key, true);
        return true;
      }
      return false;
    };
  }

  /* ══════════════════════════════════════════
     15. 부트
     ══════════════════════════════════════════ */
  resize();
  genChunk();
  ensureAhead(120 + viewW * 2.4);
  cam.x = P.x - viewW * 0.42;
  cam.y = -VIEW_H * 0.74;
  lives = DIFF[diff].lives;
  updateHUD();
  showOverlay("ready");
  window.requestAnimationFrame(frame);

  /* 디버그용 핸들 (게임 로직 확인) */
  window.__chainarm = {
    player: P, rope: rope, world: function () {
      return { platforms: platforms.length, anchors: anchors.length, spikes: spikes.length, lasers: lasers.length, orbs: orbs.length };
    },
    get run() { return run; },
    get anchors() { return anchors.map(function (a) { return { k: a.kind, x: Math.round(a.x), y: Math.round(a.y) }; }); },
    get platforms() { return platforms.map(function (p) { return { x1: Math.round(p.x1), x2: Math.round(p.x2), top: p.top }; }); },
    mode: function () { return mode; },
    start: startRun, jump: jump, grapple: grapple, detach: detach,
    cam: cam, lives: function () { return lives; },
    keys: keys,
    score: currentScore, config: function () { return { diff: diff, scale: scale, viewW: viewW, cssW: cssW, cssH: cssH }; }
  };
})();
</script>
</body>
</html>
