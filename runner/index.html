<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05060e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="사슬팔 — 네온 사이버펑크 사슬 와이어 액션 미니게임">
<title>사슬팔 · CHAIN ARM</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --nr-ink: #05060e;
    --nr-deep: #0b0d24;
    --nr-navy: #101536;
    --nr-white: #eaf4ff;
    --nr-cyan: #2bf2ff;
    --nr-crimson: #ff2d55;
    --nr-magenta: #ff3ea5;
    --nr-violet: #7c5cff;
    --nr-amber: #ffcf4d;
  }

  html, body {
    margin: 0; padding: 0;
    height: 100%; width: 100%;
    overflow: hidden;
    background: var(--pickle-surface-page, #05060e);
    overscroll-behavior: none;
  }

  .nr-root {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
    background: var(--nr-ink);
    font: var(--pickle-type-caption, 12px/1.3 system-ui, -apple-system, "Apple SD Gothic Neo", sans-serif);
  }

  #game { display: block; width: 100%; height: 100%; }

  /* ───────── HUD ───────── */
  .hud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 12px) calc(env(safe-area-inset-right, 0px) + 14px) 30px calc(env(safe-area-inset-left, 0px) + 16px);
    pointer-events: none;
    z-index: 3;
  }
  .hud::before {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(5, 6, 14, 0.86), rgba(5, 6, 14, 0.42) 52%, transparent);
    pointer-events: none;
  }
  .hud__col { position: relative; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .hud__col--right { align-items: flex-end; text-align: right; }
  .hud__label {
    font: var(--pickle-type-caption, 11px/1.2 system-ui);
    font-size: 9.5px;
    letter-spacing: 0.26em;
    color: var(--nr-cyan);
    opacity: 0.75;
  }
  .hud__value {
    font: var(--pickle-type-title, 600 22px/1.05 system-ui);
    font-size: clamp(24px, 7vw, 34px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--nr-white);
    text-shadow: 0 0 18px rgba(43, 242, 255, 0.55);
  }
  .hud__value small {
    font-size: 0.5em;
    opacity: 0.65;
    margin-left: 2px;
    letter-spacing: 0.04em;
  }
  .hud__score {
    font: var(--pickle-type-heading, 600 17px/1.1 system-ui);
    font-size: clamp(20px, 5.6vw, 27px);
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--nr-amber);
    text-shadow: 0 0 16px rgba(255, 207, 77, 0.55);
  }
  .hud__best {
    font: var(--pickle-type-caption, 11px/1.2 system-ui);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: rgba(234, 244, 255, 0.55);
  }
  .hud__lives { display: flex; gap: 4px; margin-top: 4px; }
  .hud__life {
    width: 16px; height: 5px;
    border-radius: 2px;
    background: var(--nr-crimson);
    box-shadow: 0 0 8px rgba(255, 45, 85, 0.9);
    transition: opacity 0.2s ease, transform 0.2s ease;
  }
  .hud__life.is-out { background: rgba(234, 244, 255, 0.16); box-shadow: none; transform: scaleY(0.7); }
  .hud__tools { display: flex; gap: 6px; margin-top: 8px; pointer-events: auto; }
  .hud__btn {
    width: 34px; height: 34px; padding: 0;
    display: grid; place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(43, 242, 255, 0.35);
    background: rgba(10, 13, 32, 0.5);
    color: var(--nr-cyan);
    font-size: 13px; line-height: 1;
    opacity: 0.62;
    cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .hud__btn:active { opacity: 1; transform: scale(0.93); }
  .hud__btn.is-off { opacity: 0.25; text-decoration: line-through; }

  /* 콤보 */
  .combo {
    position: absolute;
    top: calc(env(safe-area-inset-top, 0px) + 64px);
    left: 50%;
    transform: translate(-50%, -6px);
    padding: 4px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255, 45, 85, 0.55);
    background: rgba(40, 4, 16, 0.55);
    color: #ffd9e3;
    font-size: 11px;
    letter-spacing: 0.16em;
    text-shadow: 0 0 10px rgba(255, 45, 85, 0.9);
    opacity: 0;
    transition: opacity 0.18s ease, transform 0.18s ease;
    pointer-events: none;
    z-index: 3;
    white-space: nowrap;
  }
  .combo.is-on { opacity: 1; transform: translate(-50%, 0); }

  /* ───────── 터치 패드 ───────── */
  .pad {
    position: absolute;
    left: 0; right: 0;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
    display: none;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 calc(env(safe-area-inset-left, 0px) + 20px) 0 calc(env(safe-area-inset-right, 0px) + 20px);
    z-index: 4;
    pointer-events: none;
  }
  .nr-root.is-touch .pad { display: flex; }
  .pad__btn {
    pointer-events: auto;
    width: 84px; height: 84px;
    border-radius: 50%;
    border: 1px solid rgba(43, 242, 255, 0.35);
    background: radial-gradient(circle at 50% 38%, rgba(43, 242, 255, 0.16), rgba(8, 10, 24, 0.62) 70%);
    color: rgba(234, 244, 255, 0.9);
    font-size: 11px;
    letter-spacing: 0.14em;
    line-height: 1.25;
    display: grid;
    place-items: center;
    -webkit-appearance: none; appearance: none;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    box-shadow: 0 0 22px rgba(43, 242, 255, 0.12), inset 0 0 22px rgba(43, 242, 255, 0.08);
    transition: transform 0.09s ease, background 0.12s ease, box-shadow 0.12s ease;
  }
  .pad__btn b { display: block; font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
  .pad__btn span { display: block; font-size: 9px; opacity: 0.6; letter-spacing: 0.16em; margin-top: 3px; }
  .pad__btn.is-down { transform: scale(0.93); background: radial-gradient(circle at 50% 38%, rgba(43, 242, 255, 0.34), rgba(8, 10, 24, 0.7) 70%); }
  .pad__btn--reel {
    border-color: rgba(255, 45, 85, 0.42);
    background: radial-gradient(circle at 50% 38%, rgba(255, 45, 85, 0.18), rgba(24, 6, 14, 0.62) 70%);
    color: #ffe3ea;
    box-shadow: 0 0 22px rgba(255, 45, 85, 0.14), inset 0 0 22px rgba(255, 45, 85, 0.08);
  }
  .pad__btn--reel.is-down {
    background: radial-gradient(circle at 50% 38%, rgba(255, 45, 85, 0.4), rgba(24, 6, 14, 0.72) 70%);
  }

  /* ───────── 힌트 ───────── */
  .hint {
    position: absolute;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 122px);
    transform: translateX(-50%);
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(6, 8, 20, 0.72);
    border: 1px solid rgba(43, 242, 255, 0.22);
    color: rgba(234, 244, 255, 0.86);
    font-size: 11px;
    letter-spacing: 0.06em;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.35s ease;
    pointer-events: none;
    z-index: 4;
    max-width: 88vw;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .hint.is-on { opacity: 1; }

  /* ───────── 오버레이 ───────── */
  .overlay {
    position: absolute;
    inset: 0;
    z-index: 6;
    display: none;
    align-items: center;
    justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 18px) 18px calc(env(safe-area-inset-bottom, 0px) + 18px);
    background: radial-gradient(120% 80% at 50% 30%, rgba(16, 21, 54, 0.72), rgba(3, 4, 12, 0.92));
    -webkit-backdrop-filter: blur(7px);
    backdrop-filter: blur(7px);
  }
  .overlay.is-on { display: flex; }
  .panel {
    width: 100%;
    max-width: 420px;
    max-height: 100%;
    overflow-y: auto;
    padding: 22px 20px 20px;
    border-radius: var(--pickle-radius-card, 22px);
    background: linear-gradient(160deg, rgba(18, 22, 48, 0.94), rgba(8, 9, 22, 0.94));
    border: 1px solid rgba(43, 242, 255, 0.16);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.06);
    text-align: center;
  }
  .panel__kicker {
    font-size: 9px;
    letter-spacing: 0.34em;
    color: var(--nr-cyan);
    opacity: 0.7;
  }
  .panel__title {
    margin: 8px 0 8px;
    font: var(--pickle-type-title, 600 26px/1.05 system-ui);
    font-size: clamp(30px, 10vw, 42px);
    letter-spacing: 0.02em;
    color: var(--nr-white);
    text-shadow: 0 0 26px rgba(43, 242, 255, 0.4), 0 0 60px rgba(255, 45, 85, 0.22);
  }
  .panel__title em { font-style: normal; color: var(--nr-crimson); text-shadow: 0 0 20px rgba(255, 45, 85, 0.85); }
  .panel__sub {
    margin: 0 auto 16px;
    max-width: 320px;
    font: var(--pickle-type-caption, 12px/1.55 system-ui);
    font-size: 11.5px;
    line-height: 1.6;
    color: rgba(234, 244, 255, 0.66);
  }
  .chips { display: flex; gap: 7px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
  .chip {
    padding: 7px 13px;
    border-radius: 999px;
    border: 1px solid rgba(43, 242, 255, 0.28);
    background: rgba(43, 242, 255, 0.05);
    color: rgba(234, 244, 255, 0.72);
    font-size: 11px;
    letter-spacing: 0.06em;
    cursor: pointer;
    -webkit-appearance: none; appearance: none;
  }
  .chip.is-on {
    border-color: var(--nr-cyan);
    background: rgba(43, 242, 255, 0.16);
    color: #eafcff;
    box-shadow: 0 0 16px rgba(43, 242, 255, 0.3);
  }
  .cta {
    width: 100%;
    padding: 15px 18px;
    border-radius: var(--pickle-radius-cta, 16px);
    border: 1px solid rgba(255, 45, 85, 0.5);
    background: linear-gradient(120deg, rgba(255, 45, 85, 0.94), rgba(255, 62, 165, 0.92));
    color: #fff6f8;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.06em;
    cursor: pointer;
    -webkit-appearance: none; appearance: none;
    box-shadow: 0 10px 30px rgba(255, 45, 85, 0.32);
  }
  .cta:active { transform: scale(0.985); }
  .cta--ghost {
    margin-top: 8px;
    background: transparent;
    border-color: rgba(234, 244, 255, 0.18);
    color: rgba(234, 244, 255, 0.64);
    font-weight: 500;
    box-shadow: none;
  }
  .keys {
    margin-top: 15px;
    padding-top: 13px;
    border-top: 1px solid rgba(234, 244, 255, 0.09);
    display: grid;
    gap: 5px;
    font-size: 10.5px;
    line-height: 1.5;
    color: rgba(234, 244, 255, 0.5);
    text-align: left;
  }
  .keys b {
    display: inline-block;
    min-width: 52px;
    color: rgba(43, 242, 255, 0.85);
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .panel__meta {
    margin-top: 13px;
    font-size: 10.5px;
    letter-spacing: 0.06em;
    color: rgba(234, 244, 255, 0.45);
  }
  .panel__meta b { color: var(--nr-amber); font-weight: 600; }
  .result {
    display: flex;
    justify-content: center;
    gap: 22px;
    margin: 4px 0 18px;
  }
  .result__cell { display: flex; flex-direction: column; gap: 3px; }
  .result__k { font-size: 9px; letter-spacing: 0.24em; color: rgba(43, 242, 255, 0.7); }
  .result__v {
    font-size: clamp(22px, 7vw, 30px);
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--nr-white);
    line-height: 1;
  }
  .result__v small { font-size: 0.45em; opacity: 0.6; margin-left: 1px; }
  /* ───────── 명대사 컷인 ───────── */
  .cutin {
    position: absolute;
    left: 0; right: 0;
    top: 33%;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 18px 16px;
    background: linear-gradient(to bottom, rgba(4, 5, 13, 0), rgba(4, 5, 13, 0.82) 22%, rgba(4, 5, 13, 0.82) 78%, rgba(4, 5, 13, 0));
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: none;
    z-index: 5;
  }
  .cutin.is-on { opacity: 1; transform: translateY(0); }
  .cutin__who {
    font-size: 10px;
    letter-spacing: 0.34em;
    color: var(--nr-crimson);
    text-shadow: 0 0 12px rgba(255, 45, 85, 0.8);
  }
  .cutin__line {
    font-size: clamp(15px, 4.4vw, 22px);
    font-weight: 600;
    letter-spacing: 0.01em;
    color: #f6f2ea;
    text-align: center;
    text-shadow: 0 0 22px rgba(255, 45, 85, 0.35), 0 2px 10px rgba(0, 0, 0, 0.9);
    max-width: 92vw;
  }
  .quote {
    margin: 0 0 15px;
    padding: 11px 14px;
    border-left: 2px solid rgba(255, 45, 85, 0.65);
    background: rgba(255, 45, 85, 0.05);
    border-radius: 4px 10px 10px 4px;
    text-align: left;
    display: grid;
    gap: 6px;
  }
  .quote div { font-size: 11.5px; line-height: 1.5; color: rgba(246, 242, 234, 0.82); }
  .quote b {
    display: inline-block;
    min-width: 26px;
    color: var(--nr-amber);
    font-weight: 600;
    letter-spacing: 0.1em;
    font-size: 10px;
  }
  .quote em { font-style: normal; color: #fff; }

  .badge-best {
    display: inline-block;
    margin: 0 0 12px;
    padding: 4px 12px;
    border-radius: 999px;
    background: rgba(255, 207, 77, 0.14);
    border: 1px solid rgba(255, 207, 77, 0.5);
    color: var(--nr-amber);
    font-size: 10px;
    letter-spacing: 0.18em;
  }
</style>
</head>
<body>
<div class="nr-root" id="root">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="hud__col">
      <div class="hud__label">거리</div>
      <div class="hud__value" id="hudDist">0<small>m</small></div>
    </div>
    <div class="hud__col hud__col--right">
      <div class="hud__label">점수</div>
      <div class="hud__score" id="hudScore">0</div>
      <div class="hud__best" id="hudBest">최고 0</div>
      <div class="hud__lives" id="hudLives"></div>
      <div class="hud__tools">
        <button class="hud__btn" id="btnSound" type="button" aria-label="소리">♪</button>
        <button class="hud__btn" id="btnPause" type="button" aria-label="일시정지">❚❚</button>
      </div>
    </div>
  </div>

  <div class="combo" id="hudCombo">×1</div>

  <div class="pad" id="pad">
    <button class="pad__btn" id="btnJump" type="button"><span><b>점프</b><span>JUMP</span></span></button>
    <button class="pad__btn pad__btn--reel" id="btnReel" type="button"><span><b>릴</b><span>DASH</span></span></button>
  </div>

  <div class="hint" id="hint"></div>
  <div class="cutin" id="cutin"><div class="cutin__who" id="cutinWho"></div><div class="cutin__line" id="cutinLine"></div></div>
  <div class="overlay" id="overlay"></div>
</div>

<script>
window.addEventListener("error", function (ev) {
  try {
    var box = document.getElementById("overlay");
    if (!box) { return; }
    box.classList.add("is-on");
    box.innerHTML = '<div class="panel"><div class="panel__kicker">RUNTIME ERROR</div>' +
      '<p class="panel__sub" style="color:#ff9fb0;word-break:break-all">' +
      String(ev.message || "unknown").replace(/[<>&]/g, " ") + '</p></div>';
  } catch (e) { /* 무시 */ }
});
</script>
<script>
(function () {
  "use strict";

  /* ══════════════════════════════════════════
     0. 유틸
     ══════════════════════════════════════════ */
  var TAU = Math.PI * 2;
  function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function rint(a, b) { return Math.floor(a + Math.random() * (b - a + 1)); }
  function pick(arr) { return arr[(Math.random() * arr.length) | 0]; }
  function cssVar(name, fb) {
    try {
      var v = getComputedStyle(document.documentElement).getPropertyValue(name);
      v = (v || "").trim();
      return v || fb;
    } catch (e) { return fb; }
  }
  var C = {
    ink: cssVar("--nr-ink", "#05060e"),
    deep: cssVar("--nr-deep", "#0b0d24"),
    navy: cssVar("--nr-navy", "#101536"),
    white: cssVar("--nr-white", "#eaf4ff"),
    cyan: cssVar("--nr-cyan", "#2bf2ff"),
    crimson: cssVar("--nr-crimson", "#ff2d55"),
    magenta: cssVar("--nr-magenta", "#ff3ea5"),
    violet: cssVar("--nr-violet", "#7c5cff"),
    amber: cssVar("--nr-amber", "#ffcf4d")
  };

  /* ══════════════════════════════════════════
     1. 저장 상태 (위젯 / GitHub Pages 공용)
     ══════════════════════════════════════════ */
  var WIDGET = (typeof pickle !== "undefined" && pickle && pickle.widget) ? pickle.widget : null;
  var LOCAL_KEY = "chainarm.v1";

  function readLocal() {
    try { return JSON.parse(window.localStorage.getItem(LOCAL_KEY) || "null"); }
    catch (e) { return null; }
  }
  function writeLocal(data) {
    try { window.localStorage.setItem(LOCAL_KEY, JSON.stringify(data)); } catch (e) { /* 무시 */ }
  }

  function normalize(raw) {
    var d = {
      best_score: 0, best_distance: 0, runs_played: 0, total_swings: 0,
      total_orbs: 0, last_score: 0, difficulty: "normal", sound: true,
      metrics: { best_score: 0, best_distance: 0, runs_played: 0, total_swings: 0 }
    };
    if (!raw || typeof raw !== "object") { return d; }
    function n(v) { return (typeof v === "number" && isFinite(v) && v > 0) ? Math.round(v) : 0; }
    d.best_score = n(raw.best_score);
    d.best_distance = n(raw.best_distance) || n(raw.best_dist_m);
    d.runs_played = n(raw.runs_played);
    d.total_swings = n(raw.total_swings) || n(raw.total_jumps);
    d.total_orbs = n(raw.total_orbs);
    d.last_score = n(raw.last_score);
    if (raw.difficulty === "easy" || raw.difficulty === "normal" || raw.difficulty === "hard") {
      d.difficulty = raw.difficulty;
    }
    d.sound = raw.sound !== false;
    return d;
  }

  function syncMetrics() {
    S.metrics = {
      best_score: S.best_score,
      best_distance: S.best_distance,
      runs_played: S.runs_played,
      total_swings: S.total_swings
    };
  }

  var S = normalize(WIDGET ? WIDGET.state : readLocal());

  var saveQueue = Promise.resolve();
  function persist() {
    syncMetrics();
    var payload = JSON.parse(JSON.stringify(S));
    if (WIDGET && typeof WIDGET.save === "function") {
      saveQueue = saveQueue.then(function () { return WIDGET.save(payload); })
        .catch(function () { /* 오래된 저장은 onstate가 최신 상태를 넘겨준다 */ });
      return saveQueue;
    }
    writeLocal(payload);
    return saveQueue;
  }

  var lastSignalAt = 0;
  function signal(text) {
    if (!WIDGET || typeof WIDGET.signal !== "function") { return; }
    var now = Date.now();
    if (now - lastSignalAt < 3000) { return; }
    lastSignalAt = now;
    try { WIDGET.signal(text); } catch (e) { /* 무시 */ }
  }

  /* ══════════════════════════════════════════
     2. 사운드 (Web Audio 신디사이저)
     ══════════════════════════════════════════ */
  var Sound = {
    ctx: null, master: null, noiseBuf: null,
    windSrc: null, windFilter: null, windGain: null,
    ok: false,
    init: function () {
      if (this.ctx) { this.resume(); return; }
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { return; }
      try {
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = S.sound ? 0.85 : 0.0001;
        this.master.connect(this.ctx.destination);

        var len = Math.floor(this.ctx.sampleRate * 1.5);
        var buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
        var data = buf.getChannelData(0);
        for (var i = 0; i < len; i++) { data[i] = Math.random() * 2 - 1; }
        this.noiseBuf = buf;

        var src = this.ctx.createBufferSource();
        src.buffer = buf; src.loop = true;
        var filt = this.ctx.createBiquadFilter();
        filt.type = "bandpass"; filt.frequency.value = 720; filt.Q.value = 1.4;
        var g = this.ctx.createGain(); g.gain.value = 0;
        src.connect(filt); filt.connect(g); g.connect(this.master);
        try { src.start(0); } catch (e) { /* 무시 */ }
        this.windSrc = src; this.windFilter = filt; this.windGain = g;
        this.ok = true;
      } catch (e) {
        this.ctx = null; this.ok = false;
      }
    },
    resume: function () {
      if (this.ctx && this.ctx.state === "suspended") { this.ctx.resume().catch(function () {}); }
    },
    setMuted: function (muted) {
      if (!this.ctx || !this.master) { return; }
      var t = this.ctx.currentTime;
      this.master.gain.cancelScheduledValues(t);
      this.master.gain.setTargetAtTime(muted ? 0.0001 : 0.85, t, 0.03);
    },
    tone: function (f1, f2, dur, type, gain, delay) {
      if (!this.ok || !S.sound) { return; }
      try {
        var t0 = this.ctx.currentTime + (delay || 0);
        var o = this.ctx.createOscillator();
        var g = this.ctx.createGain();
        o.type = type || "square";
        o.frequency.setValueAtTime(Math.max(20, f1), t0);
        if (f2 && f2 !== f1) { o.frequency.exponentialRampToValueAtTime(Math.max(24, f2), t0 + dur); }
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.exponentialRampToValueAtTime(Math.max(0.0003, gain), t0 + 0.012);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        o.connect(g); g.connect(this.master);
        o.start(t0); o.stop(t0 + dur + 0.04);
      } catch (e) { /* 무시 */ }
    },
    noise: function (dur, gain, freq, q, type, slideTo) {
      if (!this.ok || !S.sound) { return; }
      try {
        var t0 = this.ctx.currentTime;
        var s = this.ctx.createBufferSource();
        s.buffer = this.noiseBuf;
        var f = this.ctx.createBiquadFilter();
        f.type = type || "highpass";
        f.frequency.setValueAtTime(freq, t0);
        if (slideTo) { f.frequency.exponentialRampToValueAtTime(Math.max(60, slideTo), t0 + dur); }
        f.Q.value = q || 0.9;
        var g = this.ctx.createGain();
        g.gain.setValueAtTime(Math.max(0.0004, gain), t0);
        g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
        s.connect(f); f.connect(g); g.connect(this.master);
        s.start(t0); s.stop(t0 + dur + 0.03);
      } catch (e) { /* 무시 */ }
    },
    wind: function (amount, freq) {
      if (!this.ok || !this.windGain) { return; }
      try {
        var t = this.ctx.currentTime;
        this.windGain.gain.setTargetAtTime(S.sound ? amount : 0, t, 0.09);
        if (freq) { this.windFilter.frequency.setTargetAtTime(freq, t, 0.12); }
      } catch (e) { /* 무시 */ }
    },
    shoot: function () { this.noise(0.09, 0.16, 2400, 0.8, "highpass"); this.tone(880, 320, 0.08, "square", 0.05); },
    latch: function () { this.tone(1480, 990, 0.11, "triangle", 0.1); this.tone(700, 700, 0.2, "sine", 0.07, 0.01); this.noise(0.06, 0.12, 3200, 1.2, "highpass"); },
    miss: function () { this.tone(320, 180, 0.09, "square", 0.04); },
    release: function () { this.tone(420, 980, 0.14, "sawtooth", 0.045); this.noise(0.2, 0.1, 900, 1.1, "bandpass", 2600); },
    jump: function (n) { this.tone(n === 2 ? 620 : 480, n === 2 ? 980 : 720, 0.09, "square", 0.045); },
    dash: function () { this.noise(0.2, 0.15, 1200, 1.0, "bandpass", 300); this.tone(220, 90, 0.16, "sawtooth", 0.05); },
    orb: function () { this.tone(1180, 1760, 0.1, "triangle", 0.07); this.tone(1760, 2340, 0.08, "sine", 0.04, 0.05); },
    land: function () { this.noise(0.08, 0.1, 320, 1.0, "lowpass"); },
    hurt: function () { this.tone(240, 60, 0.42, "sawtooth", 0.13); this.noise(0.32, 0.14, 900, 0.8, "lowpass", 120); },
    over: function () { this.tone(320, 70, 0.9, "triangle", 0.13); this.tone(160, 50, 1.1, "sine", 0.1, 0.06); }
  };

  /* ══════════════════════════════════════════
     3. 캔버스 & 배경
     ══════════════════════════════════════════ */
  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d", { alpha: false });
  var root = document.getElementById("root");

  var VIEW_H = 900;
  var cssW = 375, cssH = 812, dpr = 1, scale = 1, viewW = 420;
  var maxDpr = 2;
  var lowFx = false, slowFrames = 0;
  var bgTiles = { far: null, mid: null, near: null };
  var rain = [];

  function resize() {
    cssW = Math.max(240, window.innerWidth || 375);
    cssH = Math.max(320, window.innerHeight || 812);
    dpr = Math.min(window.devicePixelRatio || 1, maxDpr);
    canvas.width = Math.round(cssW * dpr);
    canvas.height = Math.round(cssH * dpr);
    canvas.style.width = cssW + "px";
    canvas.style.height = cssH + "px";
    scale = cssH / VIEW_H;
    if (cssW / scale > 1900) { scale = cssW / 1900; }
    viewW = cssW / scale;
    buildBackground();
    seedRain();
  }

  function makeTile(kind) {
    var tw = 900, th = 480;
    var c = document.createElement("canvas");
    c.width = tw; c.height = th;
    var g = c.getContext("2d");
    var i, x, y, w;

    if (kind === "far") {
      g.fillStyle = "rgba(9, 13, 34, 0.92)";
      g.beginPath();
      g.moveTo(0, th);
      g.lineTo(0, th * 0.66);
      x = 0;
      while (x < tw) {
        w = rnd(90, 200);
        y = th * rnd(0.26, 0.6);
        g.quadraticCurveTo(x + w * 0.5, y - rnd(30, 100), x + w, th * rnd(0.42, 0.68));
        x += w;
      }
      g.lineTo(tw, th);
      g.closePath();
      g.fill();
      // 기와지붕 실루엣
      for (i = 0; i < 9; i++) {
        var hx = rnd(20, tw - 120);
        var hy = th * rnd(0.5, 0.78);
        var hs = rnd(46, 96);
        g.fillStyle = "rgba(6, 9, 22, 0.85)";
        g.beginPath();
        g.moveTo(hx, hy);
        g.quadraticCurveTo(hx + hs * 0.5, hy - hs * 0.62, hx + hs, hy);
        g.lineTo(hx + hs * 0.92, hy + 5);
        g.quadraticCurveTo(hx + hs * 0.5, hy - hs * 0.42, hx + hs * 0.08, hy + 5);
        g.closePath();
        g.fill();
      }
    } else if (kind === "mid") {
      x = -20;
      while (x < tw) {
        w = rnd(42, 96);
        var bh = rnd(70, 300);
        var tone = rint(0, 2);
        g.fillStyle = tone === 0 ? "#0b1029" : (tone === 1 ? "#0d1330" : "#0a0e24");
        g.fillRect(x, th - bh, w, bh);
        // 창문
        for (var wy = th - bh + 10; wy < th - 12; wy += 13) {
          for (var wx = x + 7; wx < x + w - 8; wx += 12) {
            if (Math.random() < 0.17) {
              g.fillStyle = Math.random() < 0.72 ? "rgba(43, 242, 255, 0.34)" : "rgba(255, 207, 77, 0.3)";
              g.fillRect(wx, wy, 3, 4);
            }
          }
        }
        // 네온 간판
        if (Math.random() < 0.3) {
          g.fillStyle = Math.random() < 0.5 ? "rgba(255, 45, 85, 0.55)" : "rgba(255, 62, 165, 0.45)";
          g.fillRect(x + 5, th - bh + rnd(14, 60), 3, rnd(18, 46));
        }
        // 안테나
        if (Math.random() < 0.25) {
          g.fillStyle = "rgba(43, 242, 255, 0.28)";
          g.fillRect(x + w * 0.5, th - bh - rnd(10, 34), 1.5, 34);
        }
        x += w + rnd(4, 22);
      }
    } else {
      g.fillStyle = "#04050c";
      // 하단 구조물
      g.fillRect(0, th - 60, tw, 60);
      x = 0;
      while (x < tw) {
        w = rnd(40, 130);
        var rh = rnd(30, 96);
        g.fillRect(x, th - 60 - rh, w, rh);
        if (Math.random() < 0.45) {
          g.fillStyle = Math.random() < 0.5 ? "rgba(43, 242, 255, 0.2)" : "rgba(255, 45, 85, 0.22)";
          g.fillRect(x + 4, th - 60 - rh + 6, w - 8, 2);
          g.fillStyle = "#04050c";
        }
        x += w + rnd(10, 60);
      }
      // 수직 배관
      for (i = 0; i < 10; i++) {
        var px = rnd(0, tw);
        g.fillStyle = "rgba(5, 7, 16, 0.95)";
        g.fillRect(px, th * rnd(0.2, 0.6), rnd(3, 9), th);
      }
    }
    return c;
  }

  function buildBackground() {
    bgTiles.far = makeTile("far");
    bgTiles.mid = makeTile("mid");
    bgTiles.near = makeTile("near");
    buildSigns();
  }

  function seedRain() {
    rain = [];
    var n = Math.round(cssW * cssH / (lowFx ? 18000 : 9000));
    for (var i = 0; i < n; i++) {
      rain.push({
        x: Math.random() * cssW,
        y: Math.random() * cssH,
        len: rnd(8, 22),
        spd: rnd(420, 900),
        a: rnd(0.05, 0.16)
      });
    }
  }

  /* ══════════════════════════════════════════
     4. 게임 상태
     ══════════════════════════════════════════ */
  var GRAV = 2250;
  var RUN_MAX = 400;
  var RUN_ACCEL = 3200;
  var AIR_ACCEL = 2100;
  var JUMP_V = 830;
  var JUMP2_V = 760;
  var ROPE_MAX = 460;
  var ROPE_MIN = 88;
  var REEL_SPEED = 780;
  var DASH_SPEED = 980;
  var DASH_CD = 0.85;
  var SPEED_CAP = 1650;
  var PUMP = 250;
  var METER = 36;
  var COMBO_WINDOW = 4.5;
  var PIT_Y = 640;

  var DIFF = {
    easy: { key: "easy", label: "쉬움", gap: 0.86, laser: 0.06, drone: 0.85, lives: 4 },
    normal: { key: "normal", label: "보통", gap: 1.0, laser: 0.13, drone: 1.0, lives: 3 },
    hard: { key: "hard", label: "어려움", gap: 1.12, laser: 0.2, drone: 1.15, lives: 2 }
  };
  var diff = DIFF[S.difficulty] ? S.difficulty : "normal";

  var mode = "ready";          // ready | playing | paused | over
  var overlayKind = null;
  var T = 0;
  var dashCd = 0;
  var dashHold = false;
  var holding = false;
  var lives = 3;
  var combo = 0;
  var comboT = 0;
  var startX = 120;
  var hintTimer = 0;

  var P = { x: 120, y: 0, vx: 0, vy: 0, onGround: true, jumps: 0, face: 1, invuln: 0, coyote: 0, legPhase: 0 };
  var rope = { on: false, a: null, ax: 0, ay: 0, len: 0, min: 0, born: 0 };
  var cp = { x: 120, y: 0 };
  var run = { dist: 0, orbPts: 0, stylePts: 0, swings: 0 };

  var platforms = [];
  var anchors = [];
  var spikes = [];
  var lasers = [];
  var orbs = [];
  var particles = [];
  var texts = [];

  var cam = { x: 0, y: -660, trauma: 0 };

  var keys = { left: false, right: false, dash: false };
  var flash = 0;
  var lastWind = 0;
  var claw = 0;

  function screenToWorld(sx, sy) {
    return { x: cam.x + sx / scale, y: cam.y + sy / scale };
  }

  /* ══════════════════════════════════════════
     5. 레벨 생성
     ══════════════════════════════════════════ */
  function addPlatform(x1, x2, top) {
    if (x2 - x1 < 4) { return null; }
    var last = platforms[platforms.length - 1];
    if (last && Math.abs(last.x2 - x1) < 1.5 && Math.abs(last.top - top) < 1.5) {
      last.x2 = x2;
      return last;
    }
    var p = { x1: x1, x2: x2, top: top };
    platforms.push(p);
    return p;
  }

  function crane(x, y) {
    return { kind: "crane", x: x, y: y, x0: x, y0: y, r: 26, ph: Math.random() * TAU, flash: 0 };
  }
  function drone(x, y, amp, spd) {
    return { kind: "drone", x: x, y: y, x0: x, y0: y, amp: amp, spd: spd, ph: Math.random() * TAU, r: 28, flash: 0, tilt: 0 };
  }

  function addOrbArc(cx, cy, n, spread) {
    for (var i = 0; i < n; i++) {
      var t = n === 1 ? 0 : (i / (n - 1)) - 0.5;
      orbs.push({ x: cx + t * (spread || 130), y: cy - Math.cos(t * Math.PI) * 34 + rnd(-8, 8), ph: Math.random() * TAU, taken: false });
    }
  }

  function addOrbLine(x, y, n, step) {
    for (var i = 0; i < n; i++) {
      orbs.push({ x: x + i * (step || 40), y: y + rnd(-10, 10), ph: Math.random() * TAU, taken: false });
    }
  }

  function genChunk() {
    var D = DIFF[diff];
    var idx = gen.index++;

    if (idx === 0) {
      addPlatform(-420, 720, 0);
      anchors.push(crane(320, -280));
      anchors.push(crane(600, -300));
      addOrbArc(450, -160, 3, 110);
      gen.gx = 720;
      gen.top = 0;
      return;
    }

    var kind;
    if (idx === 1) { kind = "gap"; }
    else if (idx === 2) { kind = "span"; }
    else if (idx === 3) { kind = "spike"; }
    else {
      var r = Math.random();
      var laserW = D.laser;
      if (r < 0.26) { kind = "gap"; }
      else if (r < 0.5) { kind = "span"; }
      else if (r < 0.66) { kind = "spike"; }
      else if (r < 0.66 + laserW) { kind = "laser"; }
      else if (r < 0.86 + laserW) { kind = "drone"; }
      else { kind = "tower"; }
    }

    if (kind === "gap") { genGap(D); }
    else if (kind === "span") { genSpan(D); }
    else if (kind === "spike") { genSpike(D); }
    else if (kind === "laser") { genLaser(D); }
    else if (kind === "drone") { genDrone(D); }
    else { genTower(D); }
  }

  function genGap(D) {
    var x = gen.gx, top = gen.top;
    var gap = rnd(310, 440) * D.gap;
    var ay = top - rnd(250, 330);
    anchors.push(crane(x + gap * 0.52, ay));
    if (Math.random() < 0.55) { anchors.push(crane(x + gap * 1.02, ay - rnd(10, 90))); }

    addOrbArc(x + gap * 0.5, top - rnd(90, 140), 3, gap * 0.5);

    var nTop = top + pick([0, 0, -60, -110]);
    var w = rnd(380, 560);
    addPlatform(x + gap, x + gap + w, nTop);

    if (Math.random() < 0.35 && w > 420) {
      var sw = rnd(70, 110);
      var sx = x + gap + w * rnd(0.45, 0.7);
      spikes.push({ x1: sx, x2: sx + sw, top: nTop });
      anchors.push(crane(sx + sw * 0.5, nTop - rnd(230, 300)));
    }

    gen.gx = x + gap + w;
    gen.top = nTop;
  }

  function genSpan(D) {
    var x = gen.gx, top = gen.top;
    var pit = rnd(620, 840) * D.gap;
    var n = pit > 800 ? 3 : 2;
    for (var i = 0; i < n; i++) {
      var t = (i + 0.5) / n;
      var ax = x + pit * t + rnd(-30, 30);
      var ay = top - rnd(250, 380) + (i % 2 ? -40 : 0);
      anchors.push(crane(ax, ay));
      addOrbArc(ax, ay + 90, 2, 70);
    }
    var nTop = top + pick([0, 0, -60]);
    var w = rnd(340, 480);
    addPlatform(x + pit, x + pit + w, nTop);
    gen.gx = x + pit + w;
    gen.top = nTop;
  }

  function genSpike(D) {
    var x = gen.gx, top = gen.top;
    var w = rnd(560, 780);
    addPlatform(x, x + w, top);

    var sw = rnd(90, 155);
    var sx = x + w * rnd(0.4, 0.52);
    spikes.push({ x1: sx, x2: sx + sw, top: top });
    anchors.push(crane(sx + sw * 0.5, top - rnd(215, 285)));
    addOrbArc(sx + sw * 0.5, top - 110, 2, 76);

    var gap = rnd(250, 350) * D.gap;
    anchors.push(crane(x + w + gap * 0.5, top - rnd(255, 320)));
    var nTop = top + pick([0, 0, -70]);
    var w2 = rnd(300, 460);
    addPlatform(x + w + gap, x + w + gap + w2, nTop);
    gen.gx = x + w + gap + w2;
    gen.top = nTop;
  }

  function genLaser(D) {
    var x = gen.gx, top = gen.top;
    var w = rnd(620, 820);
    addPlatform(x, x + w, top);

    var count = Math.random() < 0.35 ? 2 : 1;
    for (var i = 0; i < count; i++) {
      var lx = x + w * (count === 1 ? rnd(0.5, 0.66) : (0.36 + i * 0.26));
      lasers.push({
        x: lx, top: top - 580, bottom: top,
        period: rnd(2.3, 3.1), phase: Math.random() * 8,
        onT: 1.0, warnT: 0.55
      });
      anchors.push(crane(lx, top - rnd(280, 340)));
    }
    addOrbLine(x + w * 0.2, top - rnd(70, 110), 3, 46);
    gen.gx = x + w;
    gen.top = top;
  }

  function genDrone(D) {
    var x = gen.gx, top = gen.top;
    var pit = rnd(600, 800) * D.gap;
    anchors.push(drone(x + pit * 0.5, top - rnd(270, 350), rnd(90, 150), rnd(0.5, 0.95) * D.drone));
    if (pit > 700) { anchors.push(crane(x + pit * 0.92, top - rnd(250, 320))); }
    addOrbArc(x + pit * 0.5, top - 130, 3, pit * 0.5);
    var nTop = top + pick([0, 0, -60]);
    var w = rnd(340, 480);
    addPlatform(x + pit, x + pit + w, nTop);
    gen.gx = x + pit + w;
    gen.top = nTop;
  }

  function genTower(D) {
    var x = gen.gx, top = gen.top;
    var w = 280;
    addPlatform(x, x + w, top);
    anchors.push(crane(x + w * 0.5, top - rnd(240, 300)));

    var led = top;
    var cx = x + w;
    for (var i = 0; i < 3; i++) {
      var gap = rnd(130, 185);
      led -= rnd(120, 150);
      var lw = rnd(150, 210);
      addPlatform(cx + gap, cx + gap + lw, led);
      addOrbLine(cx + gap + lw * 0.3, led - 46, 2, 34);
      if (i < 2) { anchors.push(crane(cx + gap + lw * 0.5, led - rnd(210, 265))); }
      cx = cx + gap + lw;
    }

    var dropGap = rnd(300, 380) * D.gap;
    anchors.push(crane(cx + dropGap * 0.5, led - rnd(230, 300)));
    var nTop = led + 150;
    var fw = rnd(360, 500);
    addPlatform(cx + dropGap, cx + dropGap + fw, nTop);
    gen.gx = cx + dropGap + fw;
    gen.top = nTop;
  }

  function ensureAhead(untilX) {
    var guard = 0;
    while (gen.gx < untilX && guard++ < 40) { genChunk(); }
  }

  /* ══════════════════════════════════════════
     6. 파티클 / 텍스트
     ══════════════════════════════════════════ */
  function spawnSparks(x, y, n, color) {
    var col = color || C.crimson;
    for (var i = 0; i < n; i++) {
      var a = Math.random() * TAU;

        x: x, y: y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: rnd(0.24, 0.6), max: 0.6,
        size: rnd(1.4, 3.4), color: col, grav: 700, kind: "spark"
      });
    }
  }
  function spawnDust(x, y, n) {
    for (var i = 0; i < n; i++) {
      particles.push({
        x: x + rnd(-14, 14), y: y - rnd(0, 6),
        vx: rnd(-150, 150), vy: rnd(-190, -30),
        life: rnd(0.2, 0.5), max: 0.5,
        size: rnd(2, 5), color: C.cyan, grav: 250, kind: "dust"
      });

  }
  function spawnRing(x, y) {
    for (var i = 0; i < 12; i++) {

      });
    }
  }
  function spawnDeath(x, y) {
    for (var i = 0; i < 26; i++) {
      var a = Math.random() * TAU;

        x: x, y: y,

        size: rnd(2, 4.4), color: i % 3 ? C.crimson : C.magenta, grav: 900, kind: "spark"
      });
    }
  }
  function addText(x, y, str, color) {
    texts.push({ x: x, y: y, str: str, color: color, life: 1.05, max: 1.05 });
  }

  /* ══════════════════════════════════════════
     7. 플레이어 조작
     ══════════════════════════════════════════ */
  function jump() {
    if (mode !== "playing") { return; }
    if (rope.on) { detach(true); }
    if (P.onGround || P.coyote > 0) {
      P.vy = -JUMP_V;
      P.onGround = false;
      P.coyote = 0;
      P.jumps = 1;
      spawnDust(P.x, P.y, 6);
      Sound.jump(1);
    } else if (P.jumps < 2) {
      P.vy = -JUMP2_V;
      P.jumps = 2;
      spawnRing(P.x, P.y - 26);
      Sound.jump(2);
    }
  }

  function doDash() {
    if (mode !== "playing" || dashCd > 0) { return; }
    dashCd = DASH_CD;
    var dir = P.face || 1;
    if (rope.on) {
      // 스윙 대시(탄환 돌진): 접선 방향으로 튀어나간다
      var ux = P.x - rope.ax, uy = P.y - rope.ay;
      var dd = Math.sqrt(ux * ux + uy * uy) || 1;
      var tx = -uy / dd, ty = ux / dd;
      var vt = P.vx * tx + P.vy * ty;
      var s = Math.abs(vt) > 40 ? (vt > 0 ? 1 : -1) : dir;
      P.vx += tx * s * 430;
      P.vy += ty * s * 430;
      rope.len = Math.max(ROPE_MIN, rope.len - 44);
      spawnSparks(P.x, P.y - 30, 14, C.cyan);
      addText(P.x, P.y - 86, "질주", C.cyan);
    } else {
      P.vx = dir * Math.max(Math.abs(P.vx) * 1.05, DASH_SPEED);
      P.vy = Math.min(P.vy, -130);
      spawnSparks(P.x - dir * 12, P.y - 30, 12, C.cyan);
    }
    Sound.dash();
    shake(3.5, 0.2);
  }

  function shake(amount, time) {
    cam.trauma = Math.min(1.4, cam.trauma + amount * 0.055);
  }

  function attach(a) {
    rope.on = true;
    rope.a = a;
    rope.ax = a.x;
    rope.ay = a.y;
    var dx = P.x - a.x, dy = P.y - a.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    rope.len = clamp(d, ROPE_MIN, ROPE_MAX);
    rope.min = Math.max(ROPE_MIN, Math.min(rope.len * 0.62, rope.len - 80));
    rope.born = T;
    if (P.jumps < 1) { P.jumps = 1; }
    // 지면에서 걸면 사슬이 몸을 끌어올린다
    if (P.onGround) {
      P.vy = -300;
      P.onGround = false;
      P.coyote = 0;
      spawnDust(P.x, P.y, 5);
    }
    Sound.shoot();
    Sound.latch();
    spawnSparks(a.x, a.y, 14);
    a.flash = 1;
    shake(2.6, 0.16);
    run.swings++;
    S.total_swings++;
    hideHint();
  }

  function detach(launch) {
    if (!rope.on) { return; }
    rope.on = false;
    rope.a = null;
    if (launch) {
      var sp = Math.sqrt(P.vx * P.vx + P.vy * P.vy);
      if (sp > 520) {
        P.vx = P.vx * 1.1 + P.face * 95;
        P.vy = P.vy * 1.1 - 80;
        combo = Math.min(combo + 1, 9);
        comboT = COMBO_WINDOW;
        var pts = 40 * combo;
        run.stylePts += pts;
        addText(P.x, P.y - 78, "+" + pts + (combo > 1 ? " ×" + combo : ""), C.crimson);
        spawnSparks(P.x, P.y - 30, 10, C.crimson);
        Sound.release();
        shake(2.2, 0.14);
      }
    }
  }

  function grapple(aimWX, aimWY) {
    if (mode !== "playing") { return; }
    if (rope.on) { detach(true); return; }

    var best = null, bestScore = 1e9;
    for (var i = 0; i < anchors.length; i++) {
      var a = anchors[i];
      var dx = a.x - P.x, dy = a.y - P.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > ROPE_MAX + 30 || d < 46) { continue; }
      var adx = a.x - aimWX, ady = a.y - aimWY;
      var ad = Math.sqrt(adx * adx + ady * ady);
      var s = ad + d * 0.3;
      if (a.y > P.y - 40) { s += 420; }
      if (a.x < P.x - 70) { s += 260; }
      if (s < bestScore) { bestScore = s; best = a; }
    }

    if (!best) {
      Sound.shoot();
      Sound.miss();
      // 빗나간 사슬
      for (var k = 1; k <= 8; k++) {
        var t = k / 8;
        particles.push({
          x: P.x + (aimWX - P.x) * t, y: P.y - 40 + (aimWY - (P.y - 40)) * t,
          vx: 0, vy: 0, life: 0.16, max: 0.16, size: 2, color: C.crimson, grav: 0, kind: "dust"
        });
      }
      return;
    }
    attach(best);
  }

  /* ══════════════════════════════════════════
     8. 물리 스텝
     ══════════════════════════════════════════ */
  function updateAnchors(dt) {
    for (var i = 0; i < anchors.length; i++) {
      var a = anchors[i];
      if (a.kind === "drone") {
        var nx = a.x0 + Math.sin(T * a.spd + a.ph) * a.amp;
        a.tilt = (nx - a.x) * 0.02;
        a.x = nx;
      }
      if (a.flash > 0) { a.flash = Math.max(0, a.flash - dt * 3.4); }
    }
    if (rope.on && rope.a) {
      rope.ax = rope.a.x;
      rope.ay = rope.a.y;
    }
  }

  function laserState(l) {
    var cyc = (T + l.phase) % l.period;
    if (cyc < l.warnT) { return "warn"; }
    if (cyc < l.warnT + l.onT) { return "on"; }
    return "off";
  }

  function step(dt) {
    if (mode !== "playing") { return; }
    T += dt;

    if (dashCd > 0) { dashCd -= dt; }
    if (P.invuln > 0) { P.invuln -= dt; }
    if (comboT > 0) { comboT -= dt; if (comboT <= 0) { combo = 0; } }

    var ax = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (ax) { P.face = ax; }

    updateAnchors(dt);

    // 수평 가속
    if (ax !== 0) {
      var acc = P.onGround ? RUN_ACCEL : AIR_ACCEL;
      if (ax * P.vx < RUN_MAX) {
        P.vx += ax * acc * dt;
        if (ax * P.vx > RUN_MAX) { P.vx = ax * RUN_MAX; }
      }
    } else if (P.onGround) {
      P.vx *= Math.exp(-8 * dt);
      if (Math.abs(P.vx) < 5) { P.vx = 0; }
    } else {
      P.vx *= Math.exp(-0.5 * dt);
    }

    // 사슬 펌핑 (붙잡고 있는 동안 스윙 가속)
    if (rope.on && holding) {
      var ux = P.x - rope.ax, uy = P.y - rope.ay;
      var dd = Math.sqrt(ux * ux + uy * uy) || 1;
      var tx = -uy / dd, ty = ux / dd;
      var vt = P.vx * tx + P.vy * ty;
      var sdir = Math.abs(vt) > 40 ? (vt > 0 ? 1 : -1) : (P.face || 1);
      P.vx += tx * sdir * PUMP * dt;
      P.vy += ty * sdir * PUMP * dt;
    }

    // 릴인 (버튼은 강하게, 기본은 자동으로 살짝 감긴다)
    if (rope.on) {
      if (keys.dash || dashHold) {
        rope.len = Math.max(ROPE_MIN, rope.len - REEL_SPEED * dt);
        if (Math.random() < dt * 14) { spawnSparks(rope.ax, rope.ay, 1, C.amber); }
      } else if (rope.len > rope.min) {
        rope.len = Math.max(rope.min, rope.len - 780 * dt);
      }
    }

    // 중력
    P.vy += GRAV * dt;
    if (P.vy > 2100) { P.vy = 2100; }

    // 속도 상한
    var spd = Math.sqrt(P.vx * P.vx + P.vy * P.vy);
    if (spd > SPEED_CAP) {
      var k = SPEED_CAP / spd;
      P.vx *= k; P.vy *= k;
    }

    var prevY = P.y;
    P.x += P.vx * dt;
    P.y += P.vy * dt;

    // 사슬 구속
    if (rope.on) {
      var rx = P.x - rope.ax, ry = P.y - rope.ay;
      var rd = Math.sqrt(rx * rx + ry * ry) || 1;
      if (rd > rope.len) {
        rx /= rd; ry /= rd;
        P.x = rope.ax + rx * rope.len;
        P.y = rope.ay + ry * rope.len;
        var out = P.vx * rx + P.vy * ry;
        if (out > 0) { P.vx -= out * rx; P.vy -= out * ry; }
      }
    }

    // 착지
    P.onGround = false;
    if (P.vy >= 0) {
      for (var i = 0; i < platforms.length; i++) {
        var p = platforms[i];
        if (P.x < p.x1 - 8 || P.x > p.x2 + 8) { continue; }
        if (prevY <= p.top + 2 && P.y >= p.top) {
          var impact = P.vy;
          P.y = p.top;
          P.vy = 0;
          P.onGround = true;
          P.jumps = 0;
          if (rope.on) { detach(false); }
          cp.x = clamp(P.x, p.x1 + 20, p.x2 - 20);
          cp.y = p.top;
          if (impact > 760) {
            spawnDust(P.x, P.top, 9);
            Sound.land();
            shake(4, 0.22);
          } else if (impact > 260) {
            Sound.land();
          }
          break;
        }
      }
    }
    if (P.onGround) { P.coyote = 0.1; } else if (P.coyote > 0) { P.coyote -= dt; }

    // 이동 애니메이션 위상
    if (P.onGround && Math.abs(P.vx) > 40) { P.legPhase += dt * Math.abs(P.vx) * 0.045; }

    // 위험 요소
    var px1 = P.x - 13, px2 = P.x + 13, py1 = P.y - 54, py2 = P.y;

    for (var s = 0; s < spikes.length; s++) {
      var sk = spikes[s];
      if (px2 > sk.x1 && px1 < sk.x2 && py2 > sk.top - 24 && py1 < sk.top) {
        die("spike");
        return;
      }
    }
    for (var l = 0; l < lasers.length; l++) {
      var lz = lasers[l];
      if (Math.abs(P.x - lz.x) < 15 && py2 > lz.top && py1 < lz.bottom) {
        if (laserState(lz) === "on") { die("laser"); return; }
      }
    }

    // 구슬
    for (var o = 0; o < orbs.length; o++) {
      var ob = orbs[o];
      if (ob.taken) { continue; }
      var odx = ob.x - P.x, ody = ob.y - (P.y - 28);
      if (odx * odx + ody * ody < 34 * 34) {
        ob.taken = true;
        run.orbPts += 80;
        S.total_orbs++;
        addText(ob.x, ob.y - 12, "+80", C.amber);
        spawnSparks(ob.x, ob.y, 8, C.amber);
        Sound.orb();
      }
    }

    // 낙사
    if (P.y > PIT_Y) { die("fall"); return; }

    // 거리
    var d = (P.x - startX) / METER;
    if (d > run.dist) { run.dist = d; }

    // 앞쪽 지형 생성
    if (gen.gx < cam.x + viewW * 1.9) { ensureAhead(cam.x + viewW * 2.4); }

    // 카메라
    var lead = clamp(P.vx * 0.2, -130, 210);
    var tx2 = P.x + lead - viewW * 0.42;
    var ty2 = Math.min(P.y - VIEW_H * 0.55, -VIEW_H * 0.74);
    var kx = 1 - Math.exp(-9 * dt);
    var ky = 1 - Math.exp(-6 * dt);
    cam.x += (tx2 - cam.x) * kx;
    cam.y += (ty2 - cam.y) * ky;

    // 월드 정리
    if (Math.random() < dt * 0.7) { pruneWorld(); }

    // 사슬 바람 소리
    var sp2 = Math.sqrt(P.vx * P.vx + P.vy * P.vy);
    var windAmt = clamp((sp2 - 260) / 1100, 0, 1) * 0.085;
    if (Math.abs(windAmt - lastWind) > 0.012) {
      lastWind = windAmt;
      Sound.wind(windAmt, 560 + sp2 * 0.35);
    }
  }

  function pruneWorld() {
    var limit = cam.x - 2200;
    platforms = platforms.filter(function (p) { return p.x2 > limit; });
    anchors = anchors.filter(function (a) { return rope.a === a || a.x > limit; });
    spikes = spikes.filter(function (s) { return s.x2 > limit; });
    lasers = lasers.filter(function (l) { return l.x > limit; });
    orbs = orbs.filter(function (o) { return !o.taken && o.x > limit; });
  }

  function die(reason) {
    if (mode !== "playing") { return; }
    if (P.invuln > 0 && reason !== "fall") { return; }
    lives--;
    spawnDeath(P.x, P.y - 28);
    shake(10, 0.5);
    flash = 0.5;
    Sound.hurt();
    rope.on = false;
    rope.a = null;
    combo = 0;
    comboT = 0;
    P.vx = 0;
    P.vy = 0;

    if (lives <= 0) { gameOver(reason); return; }

    P.x = cp.x;
    P.y = cp.y;
    P.onGround = true;
    P.jumps = 0;
    P.invuln = 1.6;
    cam.x = P.x - viewW * 0.42;
    cam.y = Math.min(P.y - VIEW_H * 0.55, -VIEW_H * 0.74);
    showHint("사슬 코어 1개 손실 · 남은 " + lives + "개", 1.8);
  }

  /* ══════════════════════════════════════════
     9. 렌더링
     ══════════════════════════════════════════ */
  function render(dt) {
    var sh = 0, shx = 0, shy = 0;
    if (cam.trauma > 0) {
      cam.trauma = Math.max(0, cam.trauma - dt * 1.9);
      sh = cam.trauma * cam.trauma;
      shx = (Math.random() - 0.5) * 34 * sh;
      shy = (Math.random() - 0.5) * 34 * sh;
    }

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 하늘
    var sky = ctx.createLinearGradient(0, 0, 0, cssH);
    sky.addColorStop(0, "#04050d");
    sky.addColorStop(0.42, "#0a0e26");
    sky.addColorStop(0.66, "#171336");
    sky.addColorStop(0.76, "#2b1027");
    sky.addColorStop(0.86, "#0d0b1c");
    sky.addColorStop(1, "#04050c");
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, cssW, cssH);

    var groundScreenY = (0 - cam.y) * scale;

    drawMoon(groundScreenY);
    drawFarGlow(groundScreenY);

    drawCity(bgTiles.far, 0.055, 0.85, groundScreenY + 150);
    drawCity(bgTiles.mid, 0.18, 0.95, groundScreenY + 96);
    drawSigns(groundScreenY);
    drawCity(bgTiles.near, 0.44, 1, groundScreenY + 54);
    drawSkyLights();
    drawAbyss(groundScreenY);

    // 월드
    ctx.save();
    ctx.scale(scale, scale);
    ctx.translate(-cam.x + shx, -cam.y + shy);

    drawPlatforms();
    drawLasers();
    drawAnchors();
    drawOrbs();
    drawRopePreview();
    drawRope();
    drawPlayer();
    drawParticles();
    drawTexts();
    drawSpeedLines();

    ctx.restore();

    drawRain(dt);
    drawVignette();

    if (flash > 0) {
      flash = Math.max(0, flash - dt * 2.6);
      ctx.fillStyle = "rgba(255, 45, 85, " + (flash * 0.4) + ")";
      ctx.fillRect(0, 0, cssW, cssH);
    }
  }

  function drawMoon(groundScreenY) {
    var mx = cssW * 0.76, my = Math.min(cssH * 0.24, groundScreenY - 300);
    var r = Math.min(cssW * 0.115, 76);

    var g = ctx.createRadialGradient(mx, my, r * 0.4, mx, my, r * 3.4);
    g.addColorStop(0, "rgba(255, 70, 100, 0.32)");
    g.addColorStop(0.35, "rgba(190, 30, 72, 0.12)");
    g.addColorStop(1, "rgba(120, 16, 52, 0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(mx, my, r * 3.4, 0, TAU);
    ctx.fill();

    ctx.save();
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, TAU);
    ctx.clip();
    ctx.fillStyle = "rgba(224, 54, 92, 0.9)";
    ctx.fillRect(mx - r, my - r, r * 2, r * 2);
    // 대기 띠
    for (var i = 0; i < 7; i++) {
      var by = my - r + (i / 7) * r * 2 + Math.sin(i * 2.1) * 3;
      ctx.fillStyle = "rgba(12, 10, 30, " + (0.16 + (i % 3) * 0.08) + ")";
      ctx.fillRect(mx - r, by, r * 2, r * rnd(0.06, 0.16));
    }
    // 상단 하이라이트
    var hl = ctx.createLinearGradient(mx, my - r, mx, my + r);
    hl.addColorStop(0, "rgba(255, 210, 220, 0.5)");
    hl.addColorStop(0.5, "rgba(255, 210, 220, 0)");
    ctx.fillStyle = hl;
    ctx.fillRect(mx - r, my - r, r * 2, r * 2);
    ctx.restore();

    ctx.strokeStyle = "rgba(255, 160, 180, 0.45)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(mx, my, r, 0, TAU);
    ctx.stroke();

    // 달을 가로지르는 전선
    ctx.strokeStyle = "rgba(8, 10, 22, 0.75)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(0, my - r * 1.7);
    ctx.quadraticCurveTo(cssW * 0.52, my - r * 0.3, cssW, my - r * 2.1);
    ctx.stroke();
  }

  function drawFarGlow(groundScreenY) {
    var g = ctx.createLinearGradient(0, groundScreenY - 320, 0, groundScreenY + 40);
    g.addColorStop(0, "rgba(255, 45, 85, 0)");
    g.addColorStop(0.7, "rgba(255, 45, 85, 0.09)");
    g.addColorStop(1, "rgba(255, 120, 150, 0.16)");
    ctx.fillStyle = g;
    ctx.fillRect(0, groundScreenY - 320, cssW, 380);
  }

  function drawAbyss(groundScreenY) {
    var top = groundScreenY - 30;
    var g = ctx.createLinearGradient(0, top, 0, cssH);
    g.addColorStop(0, "rgba(4, 5, 13, 0)");
    g.addColorStop(0.3, "rgba(4, 5, 13, 0.6)");
    g.addColorStop(1, "rgba(3, 4, 10, 0.94)");
    ctx.fillStyle = g;
    ctx.fillRect(0, top, cssW, cssH - top);
  }

  function drawSkyLights() {
    for (var i = 0; i < 3; i++) {
      var sp = 0.012 + i * 0.006;
      var x = ((T * (18 + i * 9) - cam.x * 8 * sp) % (cssW + 260) + cssW + 260) % (cssW + 260) - 130;
      var y = cssH * (0.14 + i * 0.09) + Math.sin(T * 0.4 + i * 2) * 12;
      var pulse = 0.5 + Math.sin(T * (1.4 + i * 0.5) + i) * 0.35;
      ctx.fillStyle = i === 1 ? "rgba(255, 45, 85, " + (0.5 + pulse * 0.4) + ")" : "rgba(43, 242, 255, " + (0.35 + pulse * 0.35) + ")";
      ctx.beginPath();
      ctx.arc(x, y, 1.8, 0, TAU);
      ctx.fill();
      var gr = ctx.createRadialGradient(x, y, 0, x, y, 16);
      gr.addColorStop(0, i === 1 ? "rgba(255, 45, 85, 0.18)" : "rgba(43, 242, 255, 0.14)");
      gr.addColorStop(1, "rgba(0, 0, 0, 0)");
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(x, y, 16, 0, TAU);
      ctx.fill();
    }
  }

  function drawCity(tile, par, alpha, baseY) {
    if (!tile) { return; }
    var tw = tile.width, th = tile.height;
    var off = -(((cam.x * par * scale) % tw) + tw) % tw;
    ctx.globalAlpha = alpha;
    for (var x = off; x < cssW; x += tw) {
      ctx.drawImage(tile, Math.round(x), Math.round(baseY - th));
    }
    ctx.globalAlpha = 1;
  }

  /* ── 마고특별시 조선 네온사인 ── */
  var SIGN_TEXTS = ["마고", "의금부", "산나비", "기억 조작", "개벽", "철호", "야시장"];
  var SIGN_COLORS = ["#ff2fa0", "#2bf2ff", "#ff2d55", "#7c5cff", "#ffcf4d"];
  var signPattern = [];
  var SIGN_SPAN = 2100;

  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.lineTo(x + w - r, y);
    g.quadraticCurveTo(x + w, y, x + w, y + r);
    g.lineTo(x + w, y + h - r);
    g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    g.lineTo(x + r, y + h);
    g.quadraticCurveTo(x, y + h, x, y + h - r);
    g.lineTo(x, y + r);
    g.quadraticCurveTo(x, y, x + r, y);
    g.closePath();
  }

  function makeSignTexture(text, color, vert) {
    var fs = 15, gap = 5, padX = 11, padY = 9;
    var chars = vert ? text.replace(/\s/g, "").split("") : [text];
    var probe = document.createElement("canvas").getContext("2d");
    probe.font = "700 " + fs + "px system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif";

    var cw = 0, ch = 0, i;
    if (vert) {
      ch = chars.length * (fs + gap) - gap;
      for (i = 0; i < chars.length; i++) { cw = Math.max(cw, probe.measureText(chars[i]).width); }
    } else {
      cw = probe.measureText(text).width;
      ch = fs;
    }
    var w = Math.ceil(cw + padX * 2), h = Math.ceil(ch + padY * 2);
    var c = document.createElement("canvas");
    c.width = w * 2; c.height = h * 2;
    var g = c.getContext("2d");
    g.scale(2, 2);

    g.shadowColor = color;
    g.shadowBlur = 12;
    g.fillStyle = "rgba(5, 7, 18, 0.82)";
    g.strokeStyle = color;
    g.lineWidth = 1.3;
    rr(g, 1.5, 1.5, w - 3, h - 3, 3);
    g.fill();
    g.stroke();

    g.shadowBlur = 9;
    g.fillStyle = color;
    g.font = "700 " + fs + "px system-ui, -apple-system, 'Apple SD Gothic Neo', sans-serif";
    g.textAlign = "center";
    g.textBaseline = "middle";
    if (vert) {
      for (i = 0; i < chars.length; i++) {
        g.fillText(chars[i], w / 2, padY + i * (fs + gap) + fs / 2);
      }
    } else {
      g.fillText(text, w / 2, h / 2 + 1);
    }
    return { canvas: c, w: w, h: h };
  }

  function buildSigns() {
    signPattern = [];
    var n = SIGN_TEXTS.length;
    for (var i = 0; i < n; i++) {
      var color = SIGN_COLORS[i % SIGN_COLORS.length];
      var vert = i % 3 !== 0;
      signPattern.push({
        x: (i + rnd(0.05, 0.6)) * (SIGN_SPAN / n),
        dy: -rnd(150, 430),
        tex: makeSignTexture(SIGN_TEXTS[i], color, vert),
        flick: rnd(0, 6),
        speed: rnd(1.3, 2.4)
      });
    }
  }

  function drawSigns(groundScreenY) {
    var par = 0.42;
    var po = cam.x * par;
    for (var i = 0; i < signPattern.length; i++) {
      var s = signPattern[i];
      var k = Math.round((po - s.x) / SIGN_SPAN);
      var wx = s.x + k * SIGN_SPAN - po;
      var sx = cssW * 0.5 + wx * scale;
      var w = s.tex.w * scale, h = s.tex.h * scale;
      if (sx + w * 0.5 < -80 || sx - w * 0.5 > cssW + 80) { continue; }
      var sy = groundScreenY + s.dy * scale;
      if (sy < -h || sy > cssH + h) { continue; }
      var fl = 0.62 + Math.sin(T * s.speed + s.flick) * 0.1 + (Math.sin(T * 27 + s.flick * 3) > 0.985 ? -0.3 : 0);
      ctx.globalAlpha = clamp(fl, 0.24, 0.8);
      ctx.drawImage(s.tex.canvas, Math.round(sx - w / 2), Math.round(sy - h), Math.round(w), Math.round(h));
    }
    ctx.globalAlpha = 1;
  }

  function drawPlatforms() {
    var l = cam.x - 200, r = cam.x + viewW + 200;
    for (var i = 0; i < platforms.length; i++) {
      var p = platforms[i];
      if (p.x2 < l || p.x1 > r) { continue; }
      var w = p.x2 - p.x1, top = p.top;

      // 본체
      ctx.fillStyle = "#111834";
      ctx.fillRect(p.x1, top, w, 24);
      ctx.fillStyle = "rgba(4, 6, 16, 0.85)";
      ctx.fillRect(p.x1, top + 15, w, 9);

      // 상판 네온
      ctx.strokeStyle = "rgba(43, 242, 255, 0.85)";
      ctx.lineWidth = 2;
      ctx.shadowColor = "rgba(43, 242, 255, 0.75)";
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.moveTo(p.x1, top + 1);
      ctx.lineTo(p.x2, top + 1);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // 하부 지지
      ctx.fillStyle = "rgba(43, 242, 255, 0.1)";
      for (var x = p.x1 + 26; x < p.x2 - 12; x += 64) {
        ctx.fillRect(x, top + 24, 2, 16);
      }
      // 끝단 마킹
      ctx.fillStyle = "rgba(255, 45, 85, 0.75)";
      ctx.fillRect(p.x1, top - 4, 3, 10);
      ctx.fillRect(p.x2 - 3, top - 4, 3, 10);
    }

    // 가시
    for (var s = 0; s < spikes.length; s++) {
      var sk = spikes[s];
      if (sk.x2 < l || sk.x1 > r) { continue; }
      var n = Math.max(2, Math.round((sk.x2 - sk.x1) / 13));
      ctx.fillStyle = "rgba(255, 45, 85, 0.85)";
      ctx.shadowColor = "rgba(255, 45, 85, 0.8)";
      ctx.shadowBlur = 10;
      ctx.beginPath();
      for (var k = 0; k < n; k++) {
        var x0 = sk.x1 + ((sk.x2 - sk.x1) / n) * k;
        var x1 = x0 + (sk.x2 - sk.x1) / n;
        ctx.moveTo(x0, sk.top + 1);
        ctx.lineTo((x0 + x1) / 2, sk.top - 22);
        ctx.lineTo(x1, sk.top + 1);
      }
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawLasers() {
    var l = cam.x - 200, r = cam.x + viewW + 200;
    for (var i = 0; i < lasers.length; i++) {
      var lz = lasers[i];
      if (lz.x < l || lz.x > r) { continue; }
      var st = laserState(lz);
      var h = lz.bottom - lz.top;

      if (st === "on") {
        var g = ctx.createLinearGradient(lz.x - 16, 0, lz.x + 16, 0);
        g.addColorStop(0, "rgba(124, 92, 255, 0)");
        g.addColorStop(0.5, "rgba(190, 160, 255, 0.55)");
        g.addColorStop(1, "rgba(124, 92, 255, 0)");
        ctx.fillStyle = g;
        ctx.fillRect(lz.x - 16, lz.top, 32, h);
        ctx.strokeStyle = "rgba(235, 225, 255, 0.95)";
        ctx.lineWidth = 3;
        ctx.shadowColor = "rgba(150, 120, 255, 0.95)";
        ctx.shadowBlur = 18;
        ctx.beginPath();
        ctx.moveTo(lz.x, lz.top);
        ctx.lineTo(lz.x, lz.bottom);
        ctx.stroke();
        ctx.shadowBlur = 0;
      } else {
        var a = st === "warn" ? 0.5 + Math.sin(T * 40) * 0.35 : 0.16;
        ctx.strokeStyle = "rgba(124, 92, 255, " + a + ")";
        ctx.lineWidth = 1;
        ctx.setLineDash([7, 9]);
        ctx.beginPath();
        ctx.moveTo(lz.x, lz.top);
        ctx.lineTo(lz.x, lz.bottom);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // 발사기
      ctx.fillStyle = "#0b0f24";
      ctx.fillRect(lz.x - 10, lz.top - 16, 20, 16);
      ctx.fillStyle = st === "on" ? "rgba(190, 160, 255, 1)" : "rgba(124, 92, 255, " + (st === "warn" ? 0.9 : 0.4) + ")";
      ctx.fillRect(lz.x - 4, lz.top - 11, 8, 5);
    }
  }

  function drawAnchors() {
    var l = cam.x - 160, r = cam.x + viewW + 160;
    for (var i = 0; i < anchors.length; i++) {
      var a = anchors[i];
      if (a.x < l || a.x > r) { continue; }
      var pulse = 0.6 + Math.sin(T * 3 + a.ph) * 0.22 + a.flash * 1.4;
      var isTarget = rope.a === a;

      if (a.kind === "crane") {
        // 크레인 기둥
        ctx.strokeStyle = "rgba(43, 242, 255, 0.22)";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(a.x, a.y - 20);
        ctx.lineTo(a.x, a.y - 240);
        ctx.stroke();
        ctx.fillStyle = "rgba(9, 13, 30, 0.9)";
        ctx.fillRect(a.x - 34, a.y - 252, 68, 7);
        ctx.fillStyle = "rgba(43, 242, 255, 0.28)";
        ctx.fillRect(a.x - 34, a.y - 252, 68, 2);
        // 매다는 줄
        ctx.strokeStyle = "rgba(43, 242, 255, 0.3)";
        ctx.beginPath();
        ctx.moveTo(a.x, a.y - 245);
        ctx.lineTo(a.x, a.y - 20);
        ctx.stroke();
      } else {
        // 드론 몸체
        ctx.save();
        ctx.translate(a.x, a.y - 12);
        ctx.rotate(clamp(a.tilt, -0.22, 0.22));
        ctx.fillStyle = "#0d1228";
        ctx.strokeStyle = "rgba(255, 45, 85, 0.6)";
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.moveTo(-22, 0);
        ctx.lineTo(-12, -12);
        ctx.lineTo(12, -12);
        ctx.lineTo(22, 0);
        ctx.lineTo(12, 12);
        ctx.lineTo(-12, 12);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.fillStyle = "rgba(255, 45, 85, 0.9)";
        ctx.fillRect(-5, -3, 10, 5);
        ctx.strokeStyle = "rgba(43, 242, 255, 0.35)";
        ctx.beginPath();
        ctx.moveTo(-26, -6); ctx.lineTo(-40, -12);
        ctx.moveTo(26, -6); ctx.lineTo(40, -12);
        ctx.stroke();
        ctx.restore();
      }

      // 앵커 링
      var rr = (a.kind === "drone" ? 13 : 11) + (isTarget ? 3 : 0);
      ctx.strokeStyle = "rgba(255, 45, 85, " + clamp(pulse, 0.3, 1) + ")";
      ctx.lineWidth = isTarget ? 3 : 2;
      ctx.shadowColor = "rgba(255, 45, 85, 0.9)";
      ctx.shadowBlur = 16 + a.flash * 20;
      ctx.beginPath();
      ctx.arc(a.x, a.y, rr, 0, TAU);
      ctx.stroke();
      ctx.fillStyle = "rgba(255, 45, 85, " + (0.18 + a.flash * 0.5) + ")";
      ctx.beginPath();
      ctx.arc(a.x, a.y, rr * 0.55, 0, TAU);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  function drawOrbs() {
    var l = cam.x - 80, r = cam.x + viewW + 80;
    for (var i = 0; i < orbs.length; i++) {
      var o = orbs[i];
      if (o.taken || o.x < l || o.x > r) { continue; }
      var bob = Math.sin(T * 2.6 + o.ph) * 5;
      var sp = Math.sin(T * 4 + o.ph) * 0.5 + 1;
      ctx.save();
      ctx.translate(o.x, o.y + bob);
      ctx.rotate(Math.PI / 4);
      ctx.fillStyle = "rgba(255, 207, 77, 0.9)";
      ctx.shadowColor = "rgba(255, 207, 77, 0.95)";
      ctx.shadowBlur = 16;
      ctx.fillRect(-5 * sp, -5 * sp, 10 * sp, 10 * sp);
      ctx.shadowBlur = 0;
      ctx.restore();
    }
  }

  function bestTargetFor(wx, wy) {
    var best = null, bestScore = 1e9;
    for (var i = 0; i < anchors.length; i++) {
      var a = anchors[i];
      var dx = a.x - P.x, dy = a.y - P.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d > ROPE_MAX + 30 || d < 46) { continue; }
      var adx = a.x - wx, ady = a.y - wy;
      var ad = Math.sqrt(adx * adx + ady * ady);
      var s = ad + d * 0.3;
      if (a.y > P.y - 40) { s += 420; }
      if (a.x < P.x - 70) { s += 260; }
      if (s < bestScore) { bestScore = s; best = a; }
    }
    return best;
  }

  function drawRopePreview() {
    if (!mouse.on || rope.on || mode !== "playing") { return; }
    var wp = screenToWorld(mouse.x, mouse.y);
    var a = bestTargetFor(wp.x, wp.y);
    if (!a) { return; }
    ctx.strokeStyle = "rgba(255, 45, 85, 0.28)";
    ctx.lineWidth = 1.4;
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.moveTo(P.x, P.y - 40);
    ctx.lineTo(a.x, a.y);
    ctx.stroke();
    ctx.setLineDash([]);
    var pr = 17 + Math.sin(T * 5) * 2;
    ctx.strokeStyle = "rgba(255, 45, 85, 0.5)";
    ctx.beginPath();
    ctx.arc(a.x, a.y, pr, 0, TAU);
    ctx.stroke();
  }

  function drawRope() {
    if (!rope.on) { return; }
    var tip = armTip();
    var sx = tip.x, sy = tip.y;
    var ex = rope.ax, ey = rope.ay;
    var dx = ex - sx, dy = ey - sy;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    var n = Math.max(3, Math.floor(d / 15));

    ctx.strokeStyle = "rgba(255, 45, 85, 0.32)";
    ctx.lineWidth = 7;
    ctx.shadowColor = "rgba(255, 45, 85, 0.55)";
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();

    ctx.strokeStyle = "rgba(255, 120, 150, 0.92)";
    ctx.lineWidth = 2;
    ctx.shadowBlur = 0;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(ex, ey);
    ctx.stroke();

    // 체인 링크
    ctx.fillStyle = "rgba(255, 200, 210, 0.95)";
    for (var i = 1; i < n; i++) {
      var t = i / n;
      var px = sx + dx * t, py = sy + dy * t;
      var swing = Math.sin(T * 14 + i * 0.7) * 1.4;
      var s2 = i % 2 ? 2.2 : 3.2;
      ctx.beginPath();
      ctx.ellipse(px + swing, py, s2, s2 * 0.68, Math.atan2(dy, dx), 0, TAU);
      ctx.fill();
    }
  }

  function armTip() {
    var sx = P.face * 7, sy = -43;                     // 어깨 (로컬 좌표)
    var ang;
    if (rope.on) {
      ang = Math.atan2(rope.ay - (P.y + sy * HERO_S), rope.ax - (P.x + sx * HERO_S));
    } else {
      ang = P.face > 0 ? 1.2 : Math.PI - 1.2;
    }
    var len = rope.on ? (15 + claw * 7) : 12;
    var lx = sx + Math.cos(ang) * len;
    var ly = sy + Math.sin(ang) * len;
    return { x: P.x + lx * HERO_S, y: P.y + ly * HERO_S, lx: lx, ly: ly, ang: ang, len: len };
  }

  function drawPlayer() {
    var spd = Math.sqrt(P.vx * P.vx + P.vy * P.vy);
    var flow = clamp(spd / 760, 0, 1);
    var back = -P.face;

    // 잔상
    if (spd > 520) {
      for (var i = 0; i < trail.length; i++) {
        var tr = trail[i];
        var a = (i / trail.length) * 0.24;
        ctx.fillStyle = "rgba(255, 45, 85, " + a + ")";
        ctx.fillRect(tr.x - 11, tr.y - 66, 22, 62);
      }
    }

    var blink = P.invuln > 0 && Math.floor(P.invuln * 14) % 2 === 0;
    if (blink) { return; }

    ctx.save();
    ctx.translate(P.x, P.y);
    ctx.scale(HERO_S, HERO_S);

    // 발밑 그림자
    if (P.onGround) {
      ctx.fillStyle = "rgba(2, 4, 12, 0.45)";
      ctx.beginPath();
      ctx.ellipse(0, -1, 15, 3.4, 0, 0, TAU);
      ctx.fill();
    }

    // 몸 주변 광
    var gl = ctx.createRadialGradient(0, -34, 6, 0, -34, 52);
    gl.addColorStop(0, "rgba(43, 242, 255, 0.14)");
    gl.addColorStop(1, "rgba(43, 242, 255, 0)");
    ctx.fillStyle = gl;
    ctx.beginPath();
    ctx.arc(0, -34, 52, 0, TAU);
    ctx.fill();

    /* ══ 도포자락 (뒤로 길게 펄럭) ══ */
    var sway = Math.sin(T * 8.5) * 2.4;
    var tailX = back * (13 + flow * 24);
    var tailY = -4 - flow * 8 + sway;

    ctx.beginPath();
    ctx.moveTo(-5, -33);
    ctx.quadraticCurveTo(back * 10, -18, back * (10 + flow * 10), 3);
    ctx.quadraticCurveTo(tailX * 0.92, 12 + sway, tailX, tailY);
    ctx.quadraticCurveTo(back * 20, -16, 5, -32);
    ctx.closePath();
    ctx.fillStyle = "#0d1430";
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 45, 85, 0.55)";
    ctx.lineWidth = 1.2;
    ctx.stroke();
    // 붉은 안감
    ctx.beginPath();
    ctx.moveTo(back * 7, -21);
    ctx.quadraticCurveTo(tailX * 0.72, -7 + sway, tailX * 0.96, tailY - 1);
    ctx.strokeStyle = "rgba(255, 62, 165, 0.85)";
    ctx.lineWidth = 2.2;
    ctx.stroke();

    /* ══ 다리 (버선코) ══ */
    var lp = P.onGround ? Math.sin(P.legPhase) * 6.5 : 5;
    var lp2 = P.onGround ? Math.sin(P.legPhase + Math.PI) * 6.5 : -4;
    ctx.strokeStyle = "rgba(150, 168, 196, 0.85)";
    ctx.lineWidth = 3.2;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(-2.5, -18);
    ctx.lineTo(-2.5 + lp, -8);
    ctx.lineTo(-3.5 + lp * 1.2, -1);
    ctx.moveTo(2.5, -18);
    ctx.lineTo(2.5 + lp2, -8);
    ctx.lineTo(3.5 + lp2 * 1.2, -1);
    ctx.stroke();
    ctx.lineCap = "butt";

    /* ══ 철릭 상의 ══ */
    ctx.beginPath();
    ctx.moveTo(-9, -45);
    ctx.lineTo(9, -45);
    ctx.lineTo(8, -22);
    ctx.quadraticCurveTo(0, -18.5, -8, -22);
    ctx.closePath();
    ctx.fillStyle = "#0a0f24";
    ctx.fill();
    ctx.strokeStyle = "rgba(122, 168, 214, 0.22)";
    ctx.lineWidth = 0.9;
    ctx.stroke();

    // 여민 깃 (붉은 안감이 비친다)
    ctx.beginPath();
    ctx.moveTo(P.face * 1.5, -45);
    ctx.lineTo(P.face * 7.5, -24);
    ctx.strokeStyle = "rgba(255, 45, 85, 0.9)";
    ctx.lineWidth = 1.7;
    ctx.stroke();

    // 허리띠
    ctx.fillStyle = "rgba(255, 45, 85, 0.85)";
    ctx.fillRect(-8, -25.5, 16, 2.2);

    /* ══ 철호패 : 금테 + 청록 + 삼색태극 + 호랑이 ══ */
    ctx.save();
    ctx.translate(0, -36.5);
    ctx.fillStyle = "#131c30";
    ctx.strokeStyle = "rgba(255, 207, 77, 0.95)";
    ctx.lineWidth = 1.1;
    rr(ctx, -5.5, -4.5, 11, 10, 1.8);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = "rgba(43, 242, 255, 0.55)";
    ctx.lineWidth = 0.6;
    rr(ctx, -4, -3, 8, 7, 1.2);
    ctx.stroke();
    // 삼색태극
    var segs = ["#ff2d55", "#2bf2ff", "#ffcf4d"];
    for (var s2 = 0; s2 < 3; s2++) {
      ctx.beginPath();
      ctx.moveTo(0, -1.6);
      ctx.arc(0, -1.6, 2.2, (s2 / 3) * TAU - 0.6, ((s2 + 1) / 3) * TAU - 0.6);
      ctx.closePath();
      ctx.fillStyle = segs[s2];
      ctx.fill();
    }
    // 호랑이 눈/줄무늬
    ctx.fillStyle = "rgba(255, 207, 77, 0.9)";
    ctx.fillRect(-2.4, 2.6, 1.2, 1.2);
    ctx.fillRect(1.2, 2.6, 1.2, 1.2);
    ctx.strokeStyle = "rgba(43, 242, 255, 0.7)";
    ctx.lineWidth = 0.7;
    ctx.beginPath();
    ctx.moveTo(-2.6, 4.4); ctx.lineTo(2.6, 4.4);
    ctx.stroke();
    ctx.restore();

    /* ══ 왼팔 ══ */
    ctx.strokeStyle = "#0a0f24";
    ctx.lineWidth = 4.6;
    ctx.beginPath();
    ctx.moveTo(-P.face * 6, -43);
    ctx.lineTo(-P.face * 10, -30);
    ctx.stroke();
    ctx.strokeStyle = "rgba(255, 45, 85, 0.3)";
    ctx.lineWidth = 1;
    ctx.stroke();

    /* ══ 머리 ══ */
    ctx.fillStyle = "#1b2238";
    ctx.beginPath();
    ctx.arc(0, -52, 6.2, 0, TAU);
    ctx.fill();
    ctx.fillStyle = "rgba(255, 45, 85, 0.95)";
    ctx.fillRect(P.face > 0 ? 0.6 : -4.2, -53.2, 3.6, 1.7);

    /* ══ 전립 : 넓은 챙 + 원추 + 붉은 술 ══ */
    // 챙
    ctx.beginPath();
    ctx.ellipse(0, -56.5, 13, 3, 0, 0, TAU);
    ctx.fillStyle = "#080c18";
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 207, 77, 0.5)";
    ctx.lineWidth = 1;
    ctx.stroke();
    // 모자 몸체
    ctx.beginPath();
    ctx.moveTo(-6.8, -57);
    ctx.quadraticCurveTo(-3.4, -69.5, 0, -70);
    ctx.quadraticCurveTo(3.4, -69.5, 6.8, -57);
    ctx.closePath();
    ctx.fillStyle = "#0b1020";
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 45, 85, 0.35)";
    ctx.lineWidth = 0.9;
    ctx.stroke();
    // 정상 금장
    ctx.fillStyle = "rgba(255, 207, 77, 0.95)";
    ctx.beginPath();
    ctx.arc(0, -70.5, 1.6, 0, TAU);
    ctx.fill();

    // 붉은 술 (뒤로 길게 휘날린다)
    var plume = 0.5 + flow * 1.6;
    for (var p2 = 0; p2 < 3; p2++) {
      var ph = p2 * 1.1;
      var lx = back * (6 + plume * (10 + p2 * 4));
      var ly = -62 - p2 * 2 + Math.sin(T * 9 + ph) * (1.6 + flow * 3);
      var cx2 = back * (3 + plume * 5);
      var cy2 = -70 + Math.cos(T * 8 + ph) * 1.8;
      ctx.beginPath();
      ctx.moveTo(back * 1, -69);
      ctx.quadraticCurveTo(cx2, cy2, lx, ly);
      ctx.strokeStyle = p2 === 1 ? "rgba(255, 62, 165, 0.95)" : "rgba(255, 45, 85, 0.98)";
      ctx.lineWidth = p2 === 0 ? 2.6 : (p2 === 1 ? 2 : 1.5);
      ctx.lineCap = "round";
      ctx.shadowColor = "rgba(255, 45, 85, 0.75)";
      ctx.shadowBlur = 4;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.lineCap = "butt";

    /* ══ 사슬팔 : 거대 3지 집게 ══ */
    var tip = armTip();
    var ang = tip.ang, armLen = tip.len;
    var open = 0.1 + claw * 0.9;

    ctx.save();
    ctx.translate(P.face * 7, -43);
    // 어깨
    ctx.fillStyle = "#151d34";
    ctx.beginPath();
    ctx.arc(0, 0, 5.4, 0, TAU);
    ctx.fill();
    ctx.strokeStyle = "rgba(255, 45, 85, 0.75)";
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.rotate(ang);
    // 팔 마디 3개
    for (var m = 0; m < 3; m++) {
      var segW = armLen / 3;
      ctx.fillStyle = m % 2 ? "#1a2340" : "#10172c";
      ctx.fillRect(m * segW + 0.4, -3.4, segW - 0.8, 6.8);
      ctx.strokeStyle = "rgba(255, 45, 85, 0.6)";
      ctx.lineWidth = 0.6;
      ctx.strokeRect(m * segW + 0.4, -3.4, segW - 0.8, 6.8);
    }
    // 손목
    ctx.fillStyle = "#222b46";
    ctx.fillRect(armLen - 4, -4.8, 4, 9.6);
    ctx.strokeStyle = "rgba(255, 45, 85, 0.9)";
    ctx.strokeRect(armLen - 4, -4.8, 4, 9.6);

    // 집게 3지 (접힘 → 180도 전개)
    if (claw < 0.35) {
      // 접힌 상태: 짧은 갈고리 3개
      for (var c1 = -1; c1 <= 1; c1++) {
        ctx.beginPath();
        ctx.moveTo(armLen - 1, c1 * 2.1);
        ctx.quadraticCurveTo(armLen + 4.5, c1 * 3.4, armLen + 6.5, c1 * 4.2 + 2.2);
        ctx.strokeStyle = "rgba(255, 45, 85, 0.9)";
        ctx.lineWidth = 1.7;
        ctx.lineCap = "round";
        ctx.stroke();
      }
    } else {
      for (var c2 = -1; c2 <= 1; c2++) {
        ctx.save();
        ctx.translate(armLen - 1, 0);
        ctx.rotate(c2 * open * 1.0);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(7, c2 * 3.2, 11.5, c2 * 7.2 * open + 1.5);
        ctx.strokeStyle = "rgba(255, 90, 120, 0.98)";
        ctx.lineWidth = 2.1;
        ctx.lineCap = "round";
        ctx.shadowColor = "rgba(255, 45, 85, 0.9)";
        ctx.shadowBlur = 6 + claw * 8;
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.restore();
      }
    }
    ctx.lineCap = "butt";
    ctx.restore();

    ctx.restore();
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function drawParticles() {
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      if (p.life <= 0) { continue; }
      var a = clamp(p.life / p.max, 0, 1);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = a;
      if (p.kind === "spark") {
        ctx.fillRect(p.x - p.size * 0.5, p.y - p.size * 0.5, p.size, p.size * 1.6);
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, TAU);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function drawTexts() {
    ctx.textAlign = "center";
    for (var i = 0; i < texts.length; i++) {
      var t = texts[i];
      var a = clamp(t.life / t.max, 0, 1);
      ctx.globalAlpha = a;
      ctx.fillStyle = t.color;
      ctx.font = "600 20px system-ui, -apple-system, sans-serif";
      ctx.shadowColor = t.color;
      ctx.shadowBlur = 12;
      ctx.fillText(t.str, t.x, t.y - (1 - a) * 40);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
  }

  function drawSpeedLines() {
    var spd = Math.sqrt(P.vx * P.vx + P.vy * P.vy);
    if (spd < 900) { return; }
    var n = Math.min(14, Math.round((spd - 900) / 55));
    ctx.strokeStyle = "rgba(234, 244, 255, " + clamp((spd - 900) / 1400, 0, 0.22) + ")";
    ctx.lineWidth = 1.4;
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * TAU;
      var r0 = rnd(40, 110), r1 = r0 + rnd(24, 80);
      var cx = P.x, cy = P.y - 28;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(ang) * r0, cy + Math.sin(ang) * r0);
      ctx.lineTo(cx + Math.cos(ang) * r1, cy + Math.sin(ang) * r1);
      ctx.stroke();
    }
  }

  function drawRain(dt) {
    ctx.strokeStyle = "rgba(180, 225, 255, 0.5)";
    ctx.lineWidth = 1;
    for (var i = 0; i < rain.length; i++) {
      var d = rain[i];
      d.y += d.spd * dt;
      d.x -= d.spd * 0.12 * dt;
      if (d.y > cssH + 20) { d.y = -20; d.x = Math.random() * (cssW + 60); }
      if (d.x < -20) { d.x = cssW + 20; }
      ctx.globalAlpha = d.a;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x + d.len * 0.14, d.y + d.len);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawVignette() {
    var g = ctx.createRadialGradient(cssW * 0.5, cssH * 0.48, Math.min(cssW, cssH) * 0.32, cssW * 0.5, cssH * 0.5, Math.max(cssW, cssH) * 0.78);
    g.addColorStop(0, "rgba(0, 0, 0, 0)");
    g.addColorStop(1, "rgba(2, 3, 10, 0.72)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, cssW, cssH);
  }

  function startRun() {
    Sound.init();
    mode = "playing";
    showOverlay(null);
    hideHint();

    platforms = []; anchors = []; spikes = []; lasers = []; orbs = [];
    particles = []; texts = []; trail = [];
    gen = { gx: 0, top: 0, index: 0 };

    P.x = 120; P.y = 0; P.vx = 0; P.vy = 0;
    P.onGround = true; P.jumps = 0; P.face = 1; P.invuln = 0.5; P.coyote = 0; P.legPhase = 0;
    cp.x = 120; cp.y = 0;
    startX = 120;
    run = { dist: 0, orbPts: 0, stylePts: 0, swings: 0 };
    combo = 0; comboT = 0;
    lives = DIFF[diff].lives;
    rope.on = false; rope.a = null;
    dashCd = 0; dashHold = false; holding = false;
    flash = 0; cam.trauma = 0;
    T = 0;

    genChunk();
    ensureAhead(120 + viewW * 2.4);

    cam.x = P.x - viewW * 0.42;
    cam.y = Math.min(P.y - VIEW_H * 0.55, -VIEW_H * 0.74);

    S.runs_played++;
    persist();
    hudCache.dist = -1; hudCache.score = -1; hudCache.lives = -1; hudCache.combo = -1;
    updateHUD();
    showCutin("딸", "끝까지 가는 게 중요한 게 아니야!", 2.8);
    showHint(isTouch ? "위쪽을 눌러 사슬을 걸어라 · 다시 눌러 발사" : "마우스로 앵커를 클릭해 사슬을 걸어라", 5);
  }

  function gameOver(reason) {
    mode = "over";
    rope.on = false;
    rope.a = null;
    hideCutin();
    Sound.wind(0);
    Sound.over();

    var score = currentScore();
    var dist = Math.floor(run.dist);
    var isBest = score > S.best_score;

    if (isBest) { S.best_score = score; }
    if (dist > S.best_distance) { S.best_distance = dist; }
    S.last_score = score;
    persist();

    if (isBest && score > 0) {
      signal("사용자가 사슬팔에서 신기록 " + score + "점(거리 " + dist + "m)을 세웠습니다.");
    }
    hudCache.best = -1;
    updateHUD();
    showOverlay("over", { score: score, dist: dist, best: isBest, swings: run.swings, style: run.stylePts });
  }

  function togglePause() {
    if (mode === "playing") {
      mode = "paused";
      rope.on = false;
      holding = false;
      Sound.wind(0);
      showOverlay("paused");
    } else if (mode === "paused") {
      mode = "playing";
      showOverlay(null);
    }
  }

  function toggleSound() {
    S.sound = !S.sound;
    Sound.init();
    Sound.setMuted(!S.sound);
    persist();
    updateHUD();
  }

  function setDifficulty(key, start) {
    if (!DIFF[key]) { return; }
    diff = key;
    S.difficulty = key;
    lives = DIFF[key].lives;
    hudCache.lives = -1;
    persist();
    if (start) { startRun(); }
    else if (overlayKind === "ready") { showOverlay("ready"); }
    updateHUD();
  }

  function onPointerDown(e) {
    Sound.init();
    if (mode !== "playing") { return; }
    holding = true;
    var rect = canvas.getBoundingClientRect();
    var sx = e.clientX - rect.left;
    var sy = e.clientY - rect.top;
    if (isTouch && sy > cssH * 0.56) {
      jump();
      return;
    }
    var wp = screenToWorld(sx, sy);
    mouse.x = sx; mouse.y = sy; mouse.on = true;
    grapple(wp.x, wp.y);
  }
  function onPointerUp() {
    holding = false;
    // 짧은 탭으로 걸린 사슬은 바로 풀리지 않는다 (두 번째 탭에서 발사)

    mouse.x = e.clientX - rect.left;

  document.addEventListener("keydown", function (e) {
    Sound.init();
    var code = e.code || "";
    if (code === "Space" || code === "KeyW" || code === "ArrowUp" || code === "Enter") {
      e.preventDefault();
      if (mode === "playing") { jump(); }
      else if (mode === "ready" || mode === "over") { startRun(); }
      else if (mode === "paused") { togglePause(); }
      return;
    }
    if (code === "ShiftLeft" || code === "ShiftRight" || code === "KeyK" || code === "KeyJ") {
      e.preventDefault();
      keys.dash = true;
      if (mode === "playing") { doDash(); }
      return;
    }
    if (code === "ArrowLeft" || code === "KeyA") { keys.left = true; return; }
    if (code === "ArrowRight" || code === "KeyD") { keys.right = true; return; }
    if (code === "Escape" || code === "KeyP") { e.preventDefault(); togglePause(); return; }
    if (code === "KeyM") { toggleSound(); return; }
    if (code === "KeyR") { if (mode === "playing" || mode === "over") { startRun(); } }
