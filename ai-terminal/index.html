<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>AI Terminal · 무료 AI 통합 터미널</title>
<meta name="description" content="키·카드·회원가입 없이 쓰는 무료 AI 터미널. /ask /img /sum /tr /code /models /deals — 하나의 명령창에서 전부." />
<meta name="theme-color" content="#05090b" />
<meta property="og:title" content="AI Terminal · 무료 AI 통합 터미널" />
<meta property="og:description" content="/ask · /img · /sum · /tr · /code · /models · /deals — 무가입·무키 무료 AI를 한 터미널에." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='82'>▮</text></svg>" />
<style>
  :root{
    --bg:#05090b; --bg2:#070d10; --panel:#0b1216; --panel2:#0e171c;
    --line:#17242b; --line2:#22333c;
    --txt:#d9e8e6; --dim:#8fa6a6; --dim2:#5d7373;
    --mint:#5cf2b6; --cyan:#5ad1ff; --violet:#b79bff; --amber:#ffc76b; --red:#ff6f7d;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --radius:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:
      radial-gradient(1000px 520px at 78% -12%, #0d2b30 0%, transparent 60%),
      radial-gradient(700px 420px at -8% 110%, #131a35 0%, transparent 58%),
      var(--bg);
    color:var(--txt); font-family:var(--mono); font-size:13.5px; line-height:1.6;
    -webkit-font-smoothing:antialiased; overflow:hidden;
  }
  body::after{ /* subtle scanlines */
    content:""; position:fixed; inset:0; pointer-events:none; z-index:5;
    background:repeating-linear-gradient(180deg, rgba(255,255,255,.014) 0 1px, transparent 1px 3px);
    mix-blend-mode:overlay;
  }
  a{color:var(--cyan);text-decoration:none}
  a:hover{text-decoration:underline}
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;font-size:inherit}

  .app{display:flex;flex-direction:column;height:100dvh;max-width:1180px;margin:0 auto;position:relative}

  /* top bar */
  header{
    flex:0 0 auto; display:flex; align-items:center; gap:10px;
    padding:calc(9px + env(safe-area-inset-top)) 12px 9px;
    border-bottom:1px solid var(--line); background:rgba(7,13,16,.86); backdrop-filter:blur(10px);
    position:relative; z-index:4;
  }
  .dots{display:flex;gap:5px}
  .dots i{width:9px;height:9px;border-radius:50%;display:block;background:#2b3b42}
  .dots i:nth-child(1){background:#ff5f57} .dots i:nth-child(2){background:#febc2e} .dots i:nth-child(3){background:#28c840}
  .title{font-size:12px;letter-spacing:.06em;color:var(--dim);display:flex;align-items:center;gap:7px;min-width:0}
  .title b{color:var(--txt);font-weight:700;letter-spacing:.02em}
  .title .dot{width:6px;height:6px;border-radius:50%;background:var(--mint);box-shadow:0 0 8px var(--mint);animation:pulse 2.4s infinite;flex:0 0 auto}
  .title .dot.off{background:var(--dim2);box-shadow:none;animation:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .spacer{flex:1}
  .topbtn{font-size:11px;color:var(--dim2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;white-space:nowrap}
  .topbtn:hover{color:var(--txt);border-color:var(--line2)}
  .cool{font-size:11px;color:var(--amber);border:1px solid rgba(255,199,107,.35);background:rgba(255,199,107,.08);
    border-radius:8px;padding:3px 8px;white-space:nowrap;display:none}
  .cool.on{display:inline-block}

  /* main */
  main{flex:1 1 auto;min-height:0;display:flex;gap:0}
  .screen{
    flex:1 1 auto; min-width:0; overflow-y:auto; overscroll-behavior:contain;
    padding:14px 12px 18px; scroll-behavior:smooth;
  }
  .screen::-webkit-scrollbar{width:8px}
  .screen::-webkit-scrollbar-thumb{background:#1b2a31;border-radius:8px}

  .line{margin:0 0 7px;white-space:pre-wrap;word-break:break-word;animation:fade .18s ease-out}
  @keyframes fade{from{opacity:0;transform:translateY(2px)}to{opacity:1;transform:none}}
  .line .pfx{color:var(--mint);font-weight:700}
  .line.user{color:#eef7f5}
  .line.out{color:#c3d6d3}
  .line.sys{color:var(--cyan);font-size:12px}
  .line.mut{color:var(--dim2);font-size:12px}
  .line.err{color:var(--red);font-size:12.5px}
  .line.warn{color:var(--amber);font-size:12.5px}
  .line.head{color:var(--txt);font-weight:700;margin-top:14px}
  .line.think{color:var(--dim2);font-size:11.5px;font-style:italic;border-left:2px solid var(--line2);padding-left:8px}

  .block{border-left:2px solid var(--line2);padding:8px 0 8px 10px;margin:0 0 10px}
  .block.ok{border-left-color:rgba(92,242,182,.5)}
  .block.bad{border-left-color:rgba(255,111,125,.55)}

  .cmdbar{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 9px}
  .tag{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--dim2)}
  .tag.on{color:var(--mint);border-color:rgba(92,242,182,.4);background:rgba(92,242,182,.07)}

  /* code */
  pre{margin:8px 0;background:#080f12;border:1px solid var(--line);border-radius:10px;padding:9px 10px;
    overflow-x:auto;font-size:12.5px;line-height:1.55;position:relative}
  pre code{font-family:var(--mono);white-space:pre;color:#cfe7e2}
  .codewrap{position:relative}
  .copybtn{position:absolute;top:6px;right:6px;font-size:10.5px;color:var(--dim);background:rgba(10,17,20,.9);
    border:1px solid var(--line2);border-radius:7px;padding:3px 7px;z-index:1}
  .copybtn:hover{color:var(--mint);border-color:rgba(92,242,182,.5)}
  .copybtn.done{color:var(--mint);border-color:rgba(92,242,182,.5)}
  code.inline{background:#0d161a;border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12.5px;color:#bfe9df}
  .line b{color:#f0fbf8}

  /* quick starters */
  .starters{display:grid;grid-template-columns:1fr;gap:6px;margin:12px 0 2px}
  @media(min-width:560px){.starters{grid-template-columns:1fr 1fr}}
  .starter{display:flex;gap:8px;align-items:baseline;text-align:left;border:1px solid var(--line);
    border-radius:10px;padding:8px 10px;background:#0a1216;transition:.14s;overflow:hidden}
  .starter:hover{border-color:rgba(92,242,182,.45);background:#0c171b}
  .starter .k{color:var(--mint);font-size:11.5px;font-weight:700;flex:0 0 auto}
  .starter .v{color:var(--dim);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  /* tables */
  .tablewrap{overflow-x:auto;margin:8px 0 4px;border:1px solid var(--line);border-radius:10px;max-width:100%}
  table{border-collapse:collapse;width:100%;font-size:12px;min-width:520px}
  th,td{text-align:left;padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--dim2);font-weight:600;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;background:#0a1215;position:sticky;top:0}
  tr:last-child td{border-bottom:0}
  td.mono{font-family:var(--mono)}
  td.wrap{white-space:normal;min-width:180px;color:var(--dim)}
  .pill{display:inline-block;font-size:10px;border-radius:999px;padding:1px 7px;border:1px solid var(--line2);color:var(--dim)}
  .pill.ok{color:var(--mint);border-color:rgba(92,242,182,.35)}
  .pill.k{color:var(--cyan);border-color:rgba(90,209,255,.35)}
  .pill.warn{color:var(--amber);border-color:rgba(255,199,107,.35)}

  /* image result */
  .imgcard{margin:10px 0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#080f12;max-width:420px}
  .imgcard img{display:block;width:100%;height:auto;background:#0b1418;min-height:60px}
  .imgmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 9px;border-top:1px solid var(--line);font-size:11px;color:var(--dim2)}
  .imgmeta .grow{flex:1;min-width:120px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ibtn{font-size:11px;border:1px solid var(--line2);border-radius:8px;padding:4px 9px;color:var(--dim)}
  .ibtn:hover{color:var(--mint);border-color:rgba(92,242,182,.5)}
  .spinner{display:inline-block;width:11px;height:11px;border:2px solid var(--line2);border-top-color:var(--mint);
    border-radius:50%;animation:spin .8s linear infinite;vertical-align:-1px;margin-right:6px}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* input area */
  footer{flex:0 0 auto;border-top:1px solid var(--line);background:rgba(7,13,16,.94);backdrop-filter:blur(10px);
    padding:8px 10px calc(9px + env(safe-area-inset-bottom));z-index:4}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:7px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--dim);background:#0c1519;border:1px solid var(--line);
    border-radius:8px;padding:6px 9px;transition:.14s;white-space:nowrap}
  .chip:hover{color:var(--mint);border-color:rgba(92,242,182,.45)}
  .chip:active{transform:scale(.97)}
  .inrow{display:flex;align-items:center;gap:8px;background:#081013;border:1px solid var(--line2);border-radius:11px;padding:7px 9px;
    transition:border-color .15s}
  .inrow:focus-within{border-color:rgba(92,242,182,.55);box-shadow:0 0 0 3px rgba(92,242,182,.07)}
  .ps1{color:var(--mint);font-weight:700;font-size:12.5px;white-space:nowrap}
  #inp{flex:1;min-width:0;background:none;border:0;outline:none;color:var(--txt);font-family:var(--mono);font-size:13.5px;padding:2px 0}
  #inp::placeholder{color:#41565c}
  .send{width:30px;height:30px;border-radius:8px;background:rgba(92,242,182,.12);border:1px solid rgba(92,242,182,.35);
    color:var(--mint);display:grid;place-items:center;font-size:13px;flex:0 0 auto}
  .send:disabled{opacity:.4}
  .hintbar{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--dim2);margin-top:6px}
  .hintbar b{color:var(--dim)}

  /* side panel (desktop) */
  aside{display:none}
  @media(min-width:1000px){
    aside{display:block;flex:0 0 250px;border-left:1px solid var(--line);padding:14px 13px;overflow-y:auto;background:rgba(8,14,17,.5)}
    .side-h{font-size:10px;letter-spacing:.1em;color:var(--dim2);text-transform:uppercase;margin:0 0 7px}
    .side-h:not(:first-child){margin-top:18px}
    .kv{display:flex;justify-content:space-between;gap:8px;font-size:11.5px;padding:3px 0;color:var(--dim)}
    .kv b{color:var(--txt);font-weight:600;text-align:right;word-break:break-all}
    .kv b.ok{color:var(--mint)} .kv b.warn{color:var(--amber)} .kv b.bad{color:var(--red)}
    .sidecmd{display:block;width:100%;text-align:left;font-size:11.5px;color:var(--dim);padding:3px 0}
    .sidecmd:hover{color:var(--mint)}
    .sidecmd span{color:var(--cyan)}
  }
  @media(max-width:520px){
    body{font-size:13px}
    .screen{padding:12px 10px 14px}
    table{min-width:100%;font-size:11.5px}
    th,td{white-space:normal;overflow-wrap:anywhere;padding:5px 7px}
    .title span.long{display:none}
  }
</style>
</head>

<script>
/* 진단용: 이 페이지에서 난 JS 오류를 html[data-js-error] 에 남긴다(화면에는 안 보임). */
window.addEventListener('error', function(e){ var h=document.documentElement; h.dataset.jsError=(h.dataset.jsError||'')+' | '+(e.message||'error'); });
window.addEventListener('unhandledrejection', function(e){ var h=document.documentElement; h.dataset.jsError=(h.dataset.jsError||'')+' | reject:'+((e.reason&&e.reason.message)||e.reason); });
</script>

<div class="app">
  <header>

      <div class="kv"><span>딜</span><b id="kv-deals">—</b></div>
      <div class="kv"><span>D1 기록</span><b id="kv-d1">—</b></div>

      <button class="sidecmd" data-cmd="/img "><span>/img</span> 이미지 생성</button>
      <button class="sidecmd" data-cmd="/sum "><span>/sum</span> 3줄 요약</button>
      <button class="sidecmd" data-cmd="/tr "><span>/tr</span> 번역</button>
      <button class="sidecmd" data-cmd="/code "><span>/code</span> 코드 디버깅</button>

      <button class="sidecmd" data-cmd="/deals"><span>/deals</span> 무료 딜</button>
      <button class="sidecmd" data-cmd="/status"><span>/status</span> 상태 점검</button>

      <div class="kv" style="display:block;color:var(--dim2);font-size:10.5px;line-height:1.6">
        키·카드·회원가입 없이 브라우저에서 직접 호출합니다. 이미지는 IP당 45초에 1장, 텍스트는 연속 호출이 되다가 한도에 걸리면 402로 알려줍니다.
      </div>
    </aside>
  </main>

  <footer>
    <div class="chips" id="chips"></div>
    <div class="inrow">
      <span class="ps1">❯</span>
      <input id="inp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="/ask 오늘 뭐 먹지?  ·  그냥 입력하면 /ask" />
      <button class="send" id="send" aria-label="실행">↵</button>
    </div>
    <div class="hintbar"><span>↑↓ 히스토리 · Tab 자동완성</span><span><b id="hint-model">free</b> · key 0</span></div>
  </footer>
</div>

  function renderRich(text){
    var frag = document.createDocumentFragment();
    var parts = String(text).split(/```/);
    parts.forEach(function(part, i){
      if(i % 2 === 1){
        var firstNl = part.indexOf("\n");
        var lang = firstNl > -1 ? part.slice(0, firstNl).trim() : "";
        var codeText = firstNl > -1 ? part.slice(firstNl+1) : part;
        var wrap = el("div","codewrap");
        var pre = el("pre");
        var code = el("code", null, codeText.replace(/\s+$/,""));
        if(lang) code.setAttribute("data-lang", lang);
        pre.appendChild(code); wrap.appendChild(pre);
        var btn = el("button","copybtn","복사");
        btn.addEventListener("click", function(){
          copyText(codeText.trim()).then(function(ok){
            btn.textContent = ok ? "복사됨" : "실패"; btn.classList.toggle("done", ok);
            setTimeout(function(){ btn.textContent = "복사"; btn.classList.remove("done"); }, 1400);
          });
        });
        wrap.appendChild(btn);
        frag.appendChild(wrap);
      }else{
        var sec = el("div");
        sec.innerHTML = mdInline(part);
        frag.appendChild(sec);
      }
    });
    return frag;
  }

  function mdInline(t){
    var s = esc(t);
    s = s.replace(/`([^`\n]+)`/g, '<code class="inline">$1</code>');
    s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
    s = s.replace(/(^|\n)### (.+)/g, "$1<b>$2</b>");
    s = s.replace(/(^|\n)## (.+)/g, "$1<b>$2</b>");
    s = s.replace(/(^|\n)# (.+)/g, "$1<b>$2</b>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    s = s.replace(/(^|\n)[-*] /g, "$1· ");
    return s;
  }

  function parseRetry(body, fallbackSec){
    var sec = fallbackSec || 45;
    try{
      var j = JSON.parse(body);
      var msg = (j.error && j.error.message) || j.message || "";
      var m = /retry after (\d+)\s*s/i.exec(msg) || /(\d+)\s*seconds?/i.exec(msg);
      if(m) sec = Math.min(120, Math.max(1, parseInt(m[1], 10)));
      return {sec:sec, msg:msg};
    }catch(e){ return {sec:sec, msg:""}; }
  }

  function apiError(status, body){
    var e = new Error("http " + status);
    e.status = status; e.body = body;
    return e;
  }

  function streamChat(messages, onDelta, onReasoning, opts){
    opts = opts || {};
    var ctrl = new AbortController();
    var timer = setTimeout(function(){ try{ ctrl.abort(); }catch(e){} }, opts.timeout || 120000);
    return fetch(TEXT_URL, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ model:"openai", messages:messages, stream:true, max_tokens:opts.maxTokens || 900 }),
      signal: ctrl.signal
    }).then(function(res){
      if(!res.ok){
        return res.text().then(function(b){ throw apiError(res.status, b); });
      }
      var ctype = res.headers.get("content-type") || "";
      if(ctype.indexOf("event-stream") === -1 || !res.body || !res.body.getReader){
        return res.json().then(function(j){
          var t = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || "";
          if(t && onDelta) onDelta(t);
          return t;
        });
      }
      var reader = res.body.getReader(), dec = new TextDecoder("utf-8"), buf = "", full = "";
      function pump(){
        return reader.read().then(function(r){
          if(r.done) return full;
          buf += dec.decode(r.value, {stream:true});
          var idx;
          while((idx = buf.indexOf("\n")) >= 0){
            var ln = buf.slice(0, idx).trim();
            buf = buf.slice(idx + 1);
            if(ln.indexOf("data:") !== 0) continue;
            var payload = ln.slice(5).trim();
            if(!payload || payload === "[DONE]") continue;
            try{
              var j = JSON.parse(payload);
              var d = j.choices && j.choices[0] && j.choices[0].delta;
              if(!d) continue;
              if(d.reasoning && onReasoning) onReasoning(d.reasoning);
              if(d.content){ full += d.content; if(onDelta) onDelta(d.content); }
            }catch(e){}
          }
          return pump();
        });
      }
      return pump();
    }).then(function(v){ clearTimeout(timer); return v; }, function(e){ clearTimeout(timer); throw e; });
  }

  /* ---------------- 공통: 한도/에러 처리 */
  function guard(kind){
    if(kind === "img"){

            "텍스트(/ask·/sum·/tr·/code)는 별도 한도라 지금도 쓸 수 있어요. ↑ 키로 방금 명령을 불러올 수 있습니다.");
        return false;
      }
    }
    return true;
  }

  function handleApiFailure(e, kind){
    var k = kind === "img" ? "img" : "text";
    if(e && e.name === "AbortError"){ err("응답이 너무 늦어 중단했어요.", "잠시 뒤 다시 시도해 주세요."); return; }
    if(e && e.status === 402){
      var info = parseRetry(e.body || "", 45);
      setCooldown(k, info.sec * 1000);
      err("무료 한도에 걸렸어요 (" + info.sec + "초 뒤 다시).", info.msg ? info.msg : "익명 IP당 45초에 1회 제한입니다.");
      line("mut","· 잠시 뒤 같은 명령을 다시 실행하면 됩니다. 입력창에서 ↑ 를 누르면 방금 명령이 나와요.");
      return;
    }
    if(e && e.status){
      err("요청이 거부됐어요 (HTTP " + e.status + ").", String(e.body || "").slice(0, 200));
      return;
    }
    err("네트워크 오류로 응답을 못 받았어요.", (e && e.message) || "");
  }

  function thinkLine(){
    var n = el("div","line think");
    n.innerHTML = '<span class="spinner"></span><span class="js-t">생각 중…</span>';
    screenEl.appendChild(n); scrollDown();
    return {
      node:n,
      reasoning:function(txt){
        var t = n.querySelector(".js-t");
        if(!t) return;

  function runAI(opts){
    if(!guard()) return;
    if(S.busy){ err("이전 요청이 아직 진행 중이에요."); return; }
    S.busy = true; setBusy(true);
    var t0 = Date.now();
    var indicator = thinkLine();
    var body = el("div","line out");
    var rich = document.createElement("div");
    body.appendChild(rich);
    screenEl.appendChild(body); scrollDown();

    var first = true, acc = "", box = null;
    var ctxMsgs = (opts.ctx && S.ctx.length) ? S.ctx.slice(-4) : [];
    var messages = [{role:"system", content:opts.system}].concat(ctxMsgs).concat(opts.messages);

    streamChat(messages, function(delta){
      if(first){
        first = false; indicator.done();
        box = document.createElement("div");
        rich.appendChild(box);
      }
      acc += delta;
      if(box){
        box.innerHTML = mdInline(acc);
        scrollDown();
      }
    }, function(r){ indicator.reasoning(r); }, {maxTokens:opts.maxTokens || 900})
    .then(function(full){
      var text = (full && full.length ? full : acc) || "";
      if(!text.trim()){
        indicator.done();
        body.remove();
        err("빈 응답이 왔어요. 같은 명령을 한 번 더 시도해 주세요.");
        return;
      }
      indicator.done();
      body.remove();
      var out = el("div","line out");
      out.appendChild(renderRich(text));
      if(opts.ctx){
        S.ctx.push({role:"user", content:opts.messages[0].content});
        S.ctx.push({role:"assistant", content:text});
        if(S.ctx.length > 6) S.ctx = S.ctx.slice(-6);
      }
      var meta = el("div","mut", "· " + ((Date.now()-t0)/1000).toFixed(1) + "s · free keyless · " + opts.label + (ctxMsgs.length ? " · 문맥 " + (ctxMsgs.length/2) + "턴" : ""));
      meta.style.marginTop = "2px"; meta.style.fontSize = "10.5px";
      meta.style.color = "var(--dim2)";
      var cp = el("button","ibtn","결과 복사");
      cp.style.marginLeft = "6px"; cp.style.fontSize = "10px"; cp.style.padding = "2px 7px";
      cp.addEventListener("click", function(){ copyText(text).then(function(ok){ cp.textContent = ok ? "복사됨" : "실패"; }); });
      meta.appendChild(cp);
      out.appendChild(meta);
      screenEl.appendChild(out);
      scrollDown();
      S.busy = false; setBusy(false);
    })
    .catch(function(e){
      indicator.done(); body.remove();
      // GET 폴백
      if(!(e && e.status === 402) && e && (e.status === 0 || !e.status)){
        return getText(opts.system + "\n\n" + opts.messages.map(function(m){ return m.content; }).join("\n"), {})
          .then(function(txt){
            var out = el("div","line out");
            out.appendChild(renderRich(txt));
            screenEl.appendChild(out); scrollDown();
          })
          .catch(function(e2){ handleApiFailure(e2); })
          .then(function(){ S.busy = false; setBusy(false); });
      }
      handleApiFailure(e);
      S.busy = false; setBusy(false);
    });
  }

  /* ---------------- /img */
  function koToEn(prompt){
    var s = prompt;
    var used = [];
    KO_EN.forEach(function(pair){
      if(s.indexOf(pair[0]) >= 0){ s = s.split(pair[0]).join(pair[1]); used.push(pair[0]); }
    });
    return { text:s, used:used };
  }

  function parseImgArgs(args){
    var ratio = "9:16", style = null, ai = false, seed = null, rest = [];
    var tokens = args.split(/\s+/);
    for(var i=0;i<tokens.length;i++){
      var t = tokens[i];
      if(t === "--ratio" || t === "-r"){ ratio = tokens[++i] || ratio; }
      else if(t === "--style" || t === "-s"){ style = tokens[++i] || null; }
      else if(t === "--ai"){ ai = true; }
      else if(t === "--seed"){ seed = parseInt(tokens[++i], 10); }
      else rest.push(t);
    }
    return { ratio: RATIOS[ratio] ? ratio : "9:16", style: style && STYLES[style] ? style : null, ai: ai, seed: seed, prompt: rest.join(" ").trim() };
  }

  function cmdImg(args){
    if(!args) {
      err("무엇을 그릴까요? 예) /img 사이버펑크 고양이", "옵션: --ratio 1:1|9:16|16:9|4:5|2:3|3:2  --style cyber|pixel|water|icon|photo|anime|3d|dark  --ai(프롬프트를 AI가 다듬기)");
      return null;
    }
    var a = parseImgArgs(args);
    if(!a.prompt) return err("그릴 내용이 비어 있어요. 예) /img --style water 안개 낀 호수");
    if(!guard("img")) return null;
    if(S.busy){ err("이전 요청이 아직 진행 중이에요."); return; }

    var mapped = koToEn(a.prompt);
    var english = mapped.text;
    var suffix = a.style ? STYLES[a.style] : STYLES.photo;
    var finalPrompt = english + (a.style ? ", " + suffix : (/(photo|photograph|art|render)/i.test(english) ? "" : ", " + suffix));

    line("mut", "prompt  " + finalPrompt + (mapped.used.length ? "   (한글 " + mapped.used.slice(0,4).join(",") + " → 자동 변환)" : ""));

    if(a.ai && !mapped.used.length){
      // 텍스트 AI로 프롬프트 번역 (한도 1회 사용)
      S.busy = true; setBusy(true);
      var ind = thinkLine();
      streamChat([
        {role:"system", content:"Translate the user's image idea into a vivid English image prompt. Output only the prompt, no quotes, max 60 words."},
        {role:"user", content:a.prompt}
      ], function(){}, null, {maxTokens:200}).then(function(txt){
        ind.done(); S.busy = false; setBusy(false);
        var p = String(txt || "").trim().replace(/^["']|["']$/g,"");
        if(p){
          line("mut","AI prompt  " + p);
          return afterAi(p);
        }
        afterAi(finalPrompt);
      }).catch(function(e){ ind.done(); S.busy = false; setBusy(false); handleApiFailure(e); });
      return null;
    }

    afterAi(finalPrompt);
    return null;

    function afterAi(prompt){
      makeImage(prompt, a);
    }
  }

  function makeImage(prompt, a){
    var wh = RATIOS[a.ratio] || RATIOS["9:16"];
    var seed = (a.seed != null && !isNaN(a.seed)) ? a.seed : Math.floor(Math.random()*1000000);
    var url = "https://image.pollinations.ai/prompt/" + encodeURIComponent(prompt) +
      "?width=" + wh[0] + "&height=" + wh[1] + "&nologo=true&seed=" + seed + "&model=sana&referrer=buriburiyj.github.io";

    var card = document.createElement("div");
    card.className = "imgcard";
    card.style.maxWidth = a.ratio === "16:9" || a.ratio === "3:2" ? "520px" : (a.ratio === "1:1" ? "420px" : "360px");
    var holder = el("div");
    holder.style.cssText = "position:relative;display:grid;place-items:center;min-height:120px;background:#081013";
    var spin = el("div","mut");
    spin.innerHTML = '<span class="spinner"></span>그리는 중… <span class="js-el">0</span>s';
    spin.style.cssText = "color:var(--dim);font-size:12px;padding:26px 0";
    holder.appendChild(spin);
    card.appendChild(holder);

    var meta = el("div","imgmeta");
    var grow = el("div","grow", prompt);
    grow.title = prompt;
    meta.appendChild(grow);
    var save = el("button","ibtn","저장");
    var re = el("button","ibtn","다시");
    meta.appendChild(save); meta.appendChild(re);
    card.appendChild(meta);
    screenEl.appendChild(card); scrollDown();

    var t0 = Date.now();
    setCooldown("img", COOLDOWN_MS);
    var timer = setInterval(function(){
      var s = card.querySelector(".js-el");
      if(s) s.textContent = String(Math.round((Date.now()-t0)/1000));
    }, 500);

    var attempt = 0;
    function tryFetch(){
      attempt++;
      return fetch(url).then(function(res){
        var ct = res.headers.get("content-type") || "";
        if(!res.ok || ct.indexOf("image/") === -1){
          return res.text().then(function(body){
            var e2 = apiError(res.status === 200 ? 415 : res.status, body);
            if(res.status === 503 && attempt < 4){
              var wait = 10;
              spin.innerHTML = '<span class="spinner"></span>서버 혼잡 · ' + wait + '초 뒤 자동 재시도 (' + attempt + '/3)';
              return new Promise(function(ok){ setTimeout(ok, wait * 1000); }).then(tryFetch);
            }
            throw e2;
          });
        }
        return res.blob();
      });
    }
    tryFetch().then(function(blob){
      clearInterval(timer);
      var obj = URL.createObjectURL(blob);
      var img = new Image();
      img.src = obj; img.alt = prompt; img.loading = "lazy";
      img.style.cssText = "display:block;width:100%;height:auto";
      holder.innerHTML = "";
      holder.style.minHeight = "0";
      holder.appendChild(img);
      scrollDown();

      S.lastImg = {url:url, blob:blob, obj:obj, prompt:prompt};

      save.addEventListener("click", function(){ saveImage(blob, prompt, img.src); });
      re.addEventListener("click", function(){
        if(remainSec("img") > 0){ err("이미지는 아직 " + remainSec("img") + "초 남았어요."); return; }
        makeImage(prompt, a);
      });

      var m2 = el("div","mut", "· " + wh[0] + "x" + wh[1] + " · sana · seed " + seed + " · " + ((Date.now()-t0)/1000).toFixed(1) + "s");
      m2.style.cssText = "font-size:10.5px;color:var(--dim2);margin-top:2px";
      card.appendChild(m2);
    }).catch(function(e){
      clearInterval(timer);
      holder.innerHTML = "";
      var box = el("div","line err");
      if(e && e.status === 402){
        var info = parseRetry(e.body || "", 45);
        setCooldown("img", info.sec * 1000);
        box.textContent = "이미지 무료 한도에 걸렸어요. " + info.sec + "초 뒤 다시 시도해 주세요.";
        var sub = el("div","mut", info.msg || "");
        sub.style.color = "var(--dim2)"; sub.style.marginTop = "3px";
        box.appendChild(sub);
      }else if(e && e.status){
        box.textContent = "이미지 생성 실패 (HTTP " + e.status + ").";
        var d = el("div","mut", String(e.body||"").slice(0,160));
        d.style.color = "var(--dim2)"; box.appendChild(d);
      }else{
        box.textContent = "이미지를 못 받았어요. 네트워크를 확인하고 다시 시도해 주세요.";
      }
      holder.appendChild(box);
      card.querySelector(".imgmeta").style.display = "none";
    });
  }

  function saveImage(blob, prompt, objUrl){
    var name = "ai-terminal-" + prompt.replace(/[^a-z0-9]+/gi,"-").slice(0,32).replace(/^-|-$/g,"").toLowerCase() + "-" + Date.now().toString(36) + ".jpg";
    try{
      if(navigator.canShare){
        var f = new File([blob], name, {type: blob.type || "image/jpeg"});
        if(navigator.canShare({files:[f]})){
          navigator.share({files:[f], title:"AI Terminal", text:prompt}).catch(function(){});
          return;
        }
      }
    }catch(e){}
    var a = document.createElement("a");
    a.href = objUrl || URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(function(){ a.remove(); }, 400);
  }

  /* ------------------------------------------------------------ 입력 */
  function submit(){
    var v = inp.value;
    if(!v.trim()) return;
    inp.value = "";
    run(v);
  }

  sendBtn.addEventListener("click", submit);
  inp.addEventListener("keydown", function(e){
    if(e.key === "Enter"){ e.preventDefault(); submit(); return; }
    if(e.key === "ArrowUp"){
      e.preventDefault();
      var h = S.hist.length ? S.hist : (loadStore().hist || []);
      if(!h.length) return;
      if(S.hIdx === -1 || S.hIdx > h.length) S.hIdx = h.length;
      S.hIdx = Math.max(0, S.hIdx - 1);
      inp.value = h[S.hIdx] || ""; placeCaretEnd();
      return;
    }
    if(e.key === "ArrowDown"){
      e.preventDefault();
      var h2 = S.hist.length ? S.hist : (loadStore().hist || []);
      if(!h2.length) return;
      S.hIdx = Math.min(h2.length, S.hIdx + 1);
      inp.value = h2[S.hIdx] || ""; placeCaretEnd();
      return;
    }
    if(e.key === "Tab"){
      e.preventDefault();
      var v = inp.value;
      if(v.indexOf("/") !== 0) return;
      var match = CMDS.map(function(c){ return c.c; }).filter(function(c){ return c.indexOf(v.toLowerCase().split(" ")[0]) === 0; });
      if(match.length === 1){ inp.value = match[0] + " "; placeCaretEnd(); }
      else if(match.length > 1){
        line("mut", match.join("   "));
      }
    }
  });

  document.querySelectorAll(".sidecmd").forEach(function(b){
    b.addEventListener("click", function(){
      var c = b.getAttribute("data-cmd");
      if(/ $/.test(c)){ inp.value = c; inp.focus(); placeCaretEnd(); }
      else { run(c.trim()); }
    });
  });
  $("btn-help").addEventListener("click", function(){ run("/help"); });

  /* ------------------------------------------------------------ 시작 */
  var saved = loadStore();
  ["text","img"].forEach(function(k){
    var v = saved["cool_" + k];
    if(v && v > Date.now()) S.cool[k] = v;
  });
  S.hist = saved.hist || []; S.hIdx = S.hist.length;
  chips();
  tickCool();
  boot();
  window.addEventListener("resize", function(){ scrollDown(); });
})();
</script>
</body>
</html>
